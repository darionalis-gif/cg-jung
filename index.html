<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Tertium Datur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Marcellus&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0B0F1A; --ground-2:#121829; --ground-3:#1A2237;
  --line:#283048; --line-2:#3A4363;
  --text:#E9E3D3; --text-2:#A8A9B8; --text-3:#6F758C;
  --verm:#DC4A22; --verm-soft:rgba(220,74,34,.16); --on-verm:#FBF5E8;
  --gold:#CFA850; --gold-soft:rgba(207,168,80,.14);
  --lapis:#7A97E6; --lapis-soft:rgba(122,151,230,.14);
  --focus:#F1C76C; --mandala-l:62%; --blend:screen;
  --nigredo:#0A0A0E; --albedo:#EDE9DF; --citrinitas:#D8B547; --rubedo:#B8321C;
  --serif:'Cardo','Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --caps:'Marcellus','Cardo',Georgia,serif;
  --mono:'Courier Prime','Courier New',Courier,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --ground:#E9EAEF; --ground-2:#F4F4F7; --ground-3:#FFFFFF;
    --line:#CFD2DC; --line-2:#B3B8C8;
    --text:#141826; --text-2:#4F5568; --text-3:#7C8196;
    --verm:#C2361A; --verm-soft:rgba(194,54,26,.10); --on-verm:#FBF5E8;
    --gold:#8C6C1F; --gold-soft:rgba(140,108,31,.12);
    --lapis:#2C4DA3; --lapis-soft:rgba(44,77,163,.10);
    --focus:#8C6C1F; --mandala-l:42%; --blend:multiply;
    --nigredo:#15151C; --albedo:#F7F4EC; --citrinitas:#C9A227; --rubedo:#A82C17;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#E9EAEF; --ground-2:#F4F4F7; --ground-3:#FFFFFF;
  --line:#CFD2DC; --line-2:#B3B8C8;
  --text:#141826; --text-2:#4F5568; --text-3:#7C8196;
  --verm:#C2361A; --verm-soft:rgba(194,54,26,.10); --on-verm:#FBF5E8;
  --gold:#8C6C1F; --gold-soft:rgba(140,108,31,.12);
  --lapis:#2C4DA3; --lapis-soft:rgba(44,77,163,.10);
  --focus:#8C6C1F; --mandala-l:42%; --blend:multiply;
  --nigredo:#15151C; --albedo:#F7F4EC; --citrinitas:#C9A227; --rubedo:#A82C17;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--ground); color:var(--text); font-family:var(--serif); font-size:18px; line-height:1.55; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--gold)}

.shell{max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
.screen{flex:1; padding:18px 22px 28px}
.top{display:flex; align-items:center; gap:12px; padding:14px 22px 0}
.top .stage{flex:1}
.ring{flex:none}
.bar{position:sticky; bottom:0; display:flex; gap:10px; align-items:center; padding:12px 22px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--ground) 72%, transparent)}
.bar .btn.primary{flex:1}
.bar:empty{display:none}

.stage, .label, .who, .eyebrow{font-family:var(--caps); text-transform:uppercase; letter-spacing:.22em; font-size:12px; color:var(--text-2)}
.label{margin:26px 0 10px}
.prompt{font-family:var(--serif); font-weight:400; font-size:28px; line-height:1.22; text-wrap:balance; margin:10px 0 12px}
.sub{color:var(--text-2); font-size:17.5px; max-width:36em}
.sub.small{font-size:15.5px}
.sub + .sub{margin-top:10px}
.mono{font-family:var(--mono); font-size:.86em; font-variant-numeric:tabular-nums}
.big-item{font-family:var(--caps); text-transform:uppercase; letter-spacing:.2em; font-size:24px; color:var(--lapis); margin:8px 0 14px}

.btn{font-family:var(--caps); letter-spacing:.14em; text-transform:uppercase; font-size:13px; padding:14px 18px; border:1px solid var(--line-2); background:var(--ground-2); color:var(--text); border-radius:2px; text-align:center; line-height:1.2; transition:opacity .2s, background .2s}
.btn.primary{background:var(--verm); border-color:var(--verm); color:var(--on-verm)}
.btn:disabled{opacity:.38; cursor:default}
.btn.small{padding:10px 14px; font-size:12px}
.ghost{font-family:var(--caps); letter-spacing:.14em; text-transform:uppercase; font-size:12px; color:var(--text-3); padding:6px 0}
.btn.reveal{opacity:0; pointer-events:none; transition:opacity 1.6s ease}
.btn.reveal.show{opacity:1; pointer-events:auto}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px}

.field{width:100%; background:var(--ground-2); border:1px solid var(--line); color:var(--text); font:inherit; padding:13px 14px; border-radius:2px; min-height:150px; resize:vertical}
.field.line{min-height:0; resize:none}
.field.big{font-size:24px; padding:14px 16px; min-height:0; resize:none; text-align:center}
.field.short{min-height:100px}
.field::placeholder{color:var(--text-3); font-style:italic}
.field + .field, .field + .label{margin-top:12px}
.field.interim{color:var(--text-2)}

.chips{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0}
.chip{border:1px solid var(--line-2); border-radius:999px; padding:7px 14px; font-size:16.5px; background:var(--ground-2); color:var(--text); transition:background .15s, border-color .15s; text-align:left}
.chip.on{border-color:var(--verm); background:var(--verm-soft)}
.chip.gold.on{border-color:var(--gold); background:var(--gold-soft)}
.chip.lapis.on{border-color:var(--lapis); background:var(--lapis-soft)}
.chip:disabled{opacity:.4; cursor:default}
.chip .n{font-family:var(--mono); font-size:12px; color:var(--text-3); margin-left:6px}
.chip .x{margin-left:8px; color:var(--text-3)}
.chip small{display:block; font-size:14px; color:var(--text-2); font-style:italic}
.chip .swatch{display:inline-block; width:12px; height:12px; border-radius:50%; border:1px solid var(--line-2); margin-right:8px; vertical-align:-1px}

.dots{display:flex; align-items:center; gap:10px; margin:6px 0 4px}
.dot{width:22px; height:22px; border-radius:50%; border:1px solid var(--line-2); background:var(--ground-2)}
.dot.on{background:var(--verm); border-color:var(--verm)}
.dotlabel{font-style:italic; color:var(--text-2); margin-left:6px}

.quote{margin:30px 0 0; padding:0 0 0 16px; border-left:1px solid var(--line-2)}
.quote p{font-style:italic; font-size:18.5px; color:var(--text)}
.quote .cite{font-family:var(--mono); font-size:12px; color:var(--text-3); margin-top:8px; font-style:normal}
.note{color:var(--verm); font-size:16px; margin-top:10px; font-style:italic}

/* home */
.mast{padding:34px 22px 6px; text-align:center}
.mandala{display:block; width:min(70vw,320px); aspect-ratio:1; margin:0 auto 22px}
.mast h1{font-family:var(--caps); font-weight:400; font-size:30px; letter-spacing:.2em; text-transform:uppercase; line-height:1.15}
.mast .tag{font-style:italic; color:var(--text-2); margin-top:6px}
.home .screen{padding-top:4px}
.opusline{display:flex; align-items:center; justify-content:center; gap:6px; margin:6px 0 18px; flex-wrap:wrap}
.opusline i{display:inline-block; width:10px; height:10px; border-radius:50%; border:1px solid var(--line-2)}
.opusline .mono{margin-left:8px; color:var(--text-3); font-size:12px}
.card{border:1px solid var(--line-2); border-radius:2px; padding:16px 18px; margin:8px 0 6px; background:var(--ground-2)}
.card .nm{font-family:var(--caps); letter-spacing:.16em; text-transform:uppercase; font-size:13px; display:block}
.card .latin{font-style:italic; color:var(--text-3); font-size:15px}
.card p{color:var(--text-2); font-size:16.5px; margin:8px 0 12px}
.begin{display:block; width:100%; margin:8px 0 6px}
.entries{margin-top:8px}
.entry{display:grid; grid-template-columns:auto 1fr; column-gap:14px; row-gap:2px; width:100%; text-align:left; padding:13px 0; border-top:1px solid var(--line)}
.entry:last-child{border-bottom:1px solid var(--line)}
.entry .date{font-family:var(--mono); font-size:12.5px; color:var(--text-3); padding-top:5px; grid-row:span 2}
.entry .seed{font-family:var(--caps); letter-spacing:.14em; text-transform:uppercase; font-size:13px; color:var(--verm)}
.entry .seed .pr{color:var(--text-3); margin-left:8px; letter-spacing:.1em}
.entry .third{font-style:italic; color:var(--text-2); font-size:16.5px}
.practices{list-style:none; margin:0; padding:0}
.practices li{border-top:1px solid var(--line)}
.practices li:last-child{border-bottom:1px solid var(--line)}
.practices button{display:grid; grid-template-columns:34px 1fr; gap:10px; padding:12px 0; align-items:baseline; width:100%; text-align:left}
.practices .num{font-family:var(--caps); color:var(--verm); letter-spacing:.1em; font-size:14px}
.practices .nm{font-family:var(--caps); letter-spacing:.16em; text-transform:uppercase; font-size:12.5px; display:block; margin-bottom:2px}
.practices .nm i{font-family:var(--serif); text-transform:none; letter-spacing:0; color:var(--text-3); font-size:14px; margin-left:8px}
.practices p{color:var(--text-2); font-size:16px}
.practices .done{font-family:var(--mono); font-size:11.5px; color:var(--text-3); margin-left:8px}
.group{margin:18px 0 6px}
details{margin-top:8px}
summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:'+'; color:var(--text-3); font-family:var(--mono)}
details[open] summary::after{content:'–'}
.method p{color:var(--text-2); font-size:16.5px; margin-top:10px}
.method p b{color:var(--text); font-weight:400}
.foot{display:flex; gap:18px; flex-wrap:wrap; margin-top:34px; padding-top:14px; border-top:1px solid var(--line)}
.sync{width:100%; font-size:12px; color:var(--text-3); letter-spacing:.04em}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ground-3); border:1px solid var(--line-2); color:var(--text); padding:10px 16px; border-radius:2px; font-size:15px; z-index:9; box-shadow:0 6px 24px rgba(0,0,0,.25); max-width:90vw}

/* threshold */
.breath{width:170px; height:170px; border-radius:50%; border:1px solid var(--text-3); margin:44px auto 40px; animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.78); border-color:var(--text-3); box-shadow:0 0 0 0 var(--gold-soft)} 50%{transform:scale(1.14); border-color:var(--gold); box-shadow:0 0 0 14px var(--gold-soft)}}

/* association */
.wae{display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:14vh}
.wae .count{font-family:var(--mono); font-size:13px; color:var(--text-3); letter-spacing:.1em}
.stim{font-size:46px; line-height:1.1; margin:26px 0 30px; min-height:1.1em; letter-spacing:.01em; transition:opacity .12s}
.stim.blank{opacity:0}
.wae .field{max-width:320px}
.listen{font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--text-3); display:flex; gap:9px; align-items:center; justify-content:center; margin-top:16px; min-height:18px; visibility:hidden}
.listen.on{visibility:visible}
.listen i{width:8px; height:8px; border-radius:50%; background:var(--verm); animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35; transform:scale(.8)} 50%{opacity:1; transform:scale(1.1)}}
.wae .ghost{margin-top:18px}
.protocol{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13.5px; margin:16px 0 4px; font-variant-numeric:tabular-nums}
.protocol th{font-weight:400; color:var(--text-3); text-align:left; padding:6px 6px 8px; border-bottom:1px solid var(--line-2); letter-spacing:.06em}
.protocol td{padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top}
.protocol td.rt{text-align:right; white-space:nowrap}
.protocol tr.d1 td{color:var(--text)}
.protocol tr.d2 td{color:var(--verm)}
.protocol tr.d0 td{color:var(--text-2)}
.protocol .fl{color:var(--text-3); font-size:12px}
.protocol tr.d2 .fl{color:var(--verm); opacity:.8}
.tablewrap{overflow-x:auto}
.legend{font-family:var(--mono); font-size:12px; color:var(--text-3); margin-top:8px; line-height:1.6}

/* file / dossier */
.file{font-family:var(--mono); font-size:13.5px; line-height:1.6; background:var(--ground-2); border:1px solid var(--line); padding:14px 16px; margin:14px 0; white-space:pre-wrap; color:var(--text-2)}
.file b{color:var(--text); font-weight:400}
.file .k{color:var(--gold)}

/* descent */
.seedword{font-family:var(--caps); text-transform:uppercase; letter-spacing:.24em; font-size:30px; color:var(--verm); text-align:center; margin:40px 0 44px; text-wrap:balance}
.dlg{display:flex; flex-direction:column; gap:14px; margin:14px 0 22px}
.line{padding-left:14px; border-left:2px solid var(--line-2)}
.line.I{border-color:var(--verm)}
.line.F{border-color:var(--lapis)}
.line.F p{font-style:italic}
.line.A{border-color:var(--gold)}
.line.A .who{color:var(--gold)}
.line.A p{color:var(--text-2); font-size:17px}
.line .who{display:block; margin-bottom:3px}
.line p{white-space:pre-wrap}
.composer{border-top:1px solid var(--line); padding-top:16px}
.composer .chips{margin:0 0 10px}
.composer .hint{font-style:italic; color:var(--text-2); font-size:16px; margin:0 0 10px}
.composer .line.next{margin-top:6px}
.composer .line.next .who{margin-bottom:6px}
.line.I.next .field{border-color:var(--verm)}
.line.F.next .field{border-color:var(--lapis); font-style:italic}

/* the third */
.transcript{margin-top:14px}
.transcript .dlg{margin-top:12px}
.two{display:grid; gap:14px}
.two .eyebrow{margin-bottom:6px; display:block}
.two .F .eyebrow{color:var(--lapis)}
.two .I .eyebrow{color:var(--verm)}
.conj{position:relative; height:240px; margin:30px 0 20px}
.conj i{position:absolute; top:50%; left:50%; width:150px; height:150px; margin:-75px 0 0 -75px; border-radius:50%; mix-blend-mode:var(--blend)}
.conj .c1{background:var(--verm); opacity:.62; animation:c1 60s linear forwards}
.conj .c2{background:var(--lapis); opacity:.62; animation:c2 60s linear forwards}
.conj .c3{width:12px; height:12px; margin:-6px 0 0 -6px; background:var(--gold); opacity:0; animation:c3 60s linear forwards; mix-blend-mode:normal; box-shadow:0 0 18px var(--gold)}
@keyframes c1{from{transform:translateX(-96px)} to{transform:translateX(-34px)}}
@keyframes c2{from{transform:translateX(96px)} to{transform:translateX(34px)}}
@keyframes c3{0%,82%{opacity:0; transform:scale(.4)} 100%{opacity:1; transform:scale(1)}}

/* drawing */
.pad{display:block; width:100%; aspect-ratio:1; background:var(--ground-2); border:1px solid var(--line-2); border-radius:2px; touch-action:none; margin-top:14px}
.pad.small{width:min(60vw,240px); margin:10px 0; border-color:var(--line)}
.palette{display:flex; gap:10px; align-items:center; margin-top:12px}
.palette .sw{width:30px; height:30px; border-radius:50%; border:2px solid transparent}
.palette .sw.on{border-color:var(--text)}
.palette .sw.verm{background:var(--verm)} .palette .sw.lapis{background:var(--lapis)} .palette .sw.gold{background:var(--gold)} .palette .sw.text{background:var(--text)}
.palette .ghost{margin-left:auto}

/* return / entry */
.leaf{border-top:3px double var(--line-2); border-bottom:3px double var(--line-2); padding:20px 0; margin:14px 0 6px}
.leaf .eyebrow{display:block; margin:14px 0 4px}
.leaf .eyebrow:first-child{margin-top:0}
.leaf .big{font-family:var(--caps); text-transform:uppercase; letter-spacing:.2em; color:var(--verm); font-size:22px}
.leaf .third{font-style:italic; font-size:21px; line-height:1.35}
.leaf p{white-space:pre-wrap}
.leaf .dlg{margin:6px 0 0}
.leaf .colour{display:inline-flex; align-items:center; gap:8px}

/* liber */
.liber h3.label{margin-top:30px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:16.5px}
.kv .mono{color:var(--text-3); padding-top:3px}
.item{padding:10px 0; border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.item .nm{font-family:var(--caps); letter-spacing:.14em; text-transform:uppercase; font-size:12.5px}
.item .nm .n{font-family:var(--mono); color:var(--text-3); letter-spacing:0; margin-left:8px; text-transform:none}
.item p{color:var(--text-2); font-size:16px; white-space:pre-wrap}
.item p i{color:var(--text)}
.status{font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; margin-left:8px}
.status.kept{color:var(--gold)} .status.partly{color:var(--text-2)} .status.not{color:var(--verm)} .status.open{color:var(--lapis)}
.motif{display:inline-flex; align-items:baseline; gap:6px; margin:0 12px 6px 0; font-size:17px}
.motif .n{font-family:var(--mono); font-size:12px; color:var(--text-3)}
.motif.hot{color:var(--verm)}

/* analyst */
.analyst{border-left:2px solid var(--gold); padding:10px 14px 12px; margin-top:16px; background:var(--ground-2)}
.analyst .who{color:var(--gold); display:block; margin-bottom:4px}
.analyst p{white-space:pre-wrap; font-size:17px}
.analyst .err{color:var(--text-2); font-style:italic; font-size:15.5px; margin-top:6px}
.analyst .tier{font-size:11.5px; color:var(--text-3); letter-spacing:.04em; margin-top:8px}
.analyst .stop{margin-top:8px}
html:not(.has-analyst) .analyst-only{display:none !important}
.analyst-note{display:none}
html.no-analyst .analyst-note{display:block; margin-top:14px; border-left:2px solid var(--line-2); padding-left:12px}

@media (min-width:480px){ .two{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion: reduce){
  .breath{animation:none; transform:scale(1)}
  .conj .c1{animation:none; transform:translateX(-34px)}
  .conj .c2{animation:none; transform:translateX(34px)}
  .conj .c3{animation:none; opacity:1; transform:scale(1)}
  .btn.reveal{transition:none}
  .listen i{animation:none}
}
</style>
</head>

<div id="app"></div>
<script>
(() => {
'use strict';

/* ================= material ================= */
const WORDS = {
  en: ['head','green','water','to sing','death','long','ship','to pay','window','friendly','table','to ask','village','cold','stem','to dance','lake','sick','pride','to cook','ink','angry','needle','to swim','journey','blue','lamp','to sin','bread','rich','tree','to prick','pity','yellow','mountain','to die','salt','new','custom','to pray','money','foolish','notebook','to despise','finger','expensive','bird','to fall','book','unjust','frog','to part','hunger','white','child','to take care','pencil','sad','plum','to marry','house','dear','glass','to quarrel','fur','big','carrot','to paint','part','old','flower','to beat','box','wild','family','to wash','cow','stranger','luck','lie','decency','narrow','brother','to fear','stork','false','anxiety','to kiss','bride','pure','door','to choose','hay','contented','ridicule','to sleep','month','pretty','woman','to abuse'],

};
const N_WORDS = 24;
const AFFECTS = ['restless','heavy','tense','empty','sad','irritable','ashamed','afraid','longing','numb','elated','guilty'];

function editDistance(a, b) {
  const m = a.length, k = b.length; if (!m) return k; if (!k) return m;
  const d = Array.from({ length: m + 1 }, (_, i) => { const r = new Array(k + 1).fill(0); r[0] = i; return r; });
  for (let j = 1; j <= k; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= k; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[m][k];
}
function sameWord(a, b) {
  a = fold(a); b = fold(b); if (!a || !b) return { same: false, exact: false };
  if (a === b) return { same: true, exact: true };
  const len = Math.max(a.length, b.length), tol = len <= 3 ? 0 : len <= 7 ? 1 : 2;
  return { same: editDistance(a, b) <= tol, exact: false };
}

      case 'list': case 'sync': if (Array.isArray(v) && v.length) out.push(eb(st.leaf) + `<p>${v.map(esc).join(' · ')}</p>`); break;
      case 'each': { const o = v || {}; const ks = Object.keys(o).filter(k => o[k]); if (ks.length) out.push(eb(st.leaf) + `<p>${ks.map(k => `<i>${esc(k)}:</i> ${esc(o[k])}`).join('<br>')}</p>`); break; }
      case 'chips': { const opt = (st.options || []).find(o => o[0] === v); if (opt) out.push(eb(st.leaf) + `<p>${esc(opt[1])}</p>`); break; }
      case 'chipsFrom': if (v) out.push(eb(st.leaf) + `<p>${esc(v)}</p>`); break;
    }
  }
  if (d.promise?.status) out.unshift(eb('Last promise') + `<p><span class="status ${d.promise.status}">${d.promise.status}</span>${d.promise.note ? ` · ${esc(d.promise.note)}` : ''}</p>`);
  if (d.colour) out.push(eb('Colour') + `<p class="colour">${colourDot(d.colour)}${esc(COLOURS.find(c => c[0] === d.colour)?.[1] || d.colour)}</p>`);
  if (full && s.analyst?.closing) out.push(`<span class="eyebrow" style="color:var(--gold)">The analyst</span><p>${esc(s.analyst.closing)}</p>`);
  return `<div class="leaf">${out.join('')}</div>`;
}

/* ================= step renderers ================= */
function ready(st, d) {
  const v = st.field ? getPath(d.data, st.field) : null;
  switch (st.type) {
    case 'text': case 'material': return st.optional || String(v || '').trim().length >= (st.min ?? 10);
    case 'caelum': return true;
    case 'fields': return st.fields.every(f => String(getPath(d.data, f.field) || '').trim().length >= (f.min ?? 3));
    case 'list': return (v || []).length >= 1;
    case 'sync': return true;
    case 'each': { const items = D(d, st.from, []), i = d.ei || 0; return String((v || {})[items[i]] || '').trim().length >= (st.min ?? 10); }
    case 'chips': case 'chipsFrom': case 'colour': return !!(st.type === 'colour' ? d.data.colour : v);
    case 'figure': return !!(d.data.figure || '').trim();
    case 'dialogue': return (d.data.dialogue || []).filter(l => l.who !== 'A').length >= 4;
    case 'draw': return st.optional || ((v?.strokes || []).length >= 1);
    case 'promise': return !!d.data.promise?.status;
    case 'affect': return !!affectWord(d);
    case 'symbol': return String(d.data.third || '').trim().length >= 10;
    case 'protocol': return !!d.data.seed;
    default: return true;
  }
}
function refreshReady() { const d = S.draft; if (!d) return; const go = document.getElementById('go'); if (go && !go.classList.contains('reveal')) go.disabled = !ready(curStep(d), d); }

    const chips = dist.map(ix => { const it = items[ix]; return `<button class="chip ${d.data.seed?.ix === ix ? 'on' : ''}" data-act="seed" data-ix="${ix}">${esc(wordOf(d, it))}<span class="n">${it.flags.length}</span></button>`; }).join('');

/* ================= the analyst ================= */
let analyst = null, ctl = null;
const RULES = `You are the analyst's voice inside "Tertium Datur", a small private instrument that one person uses alone, on a phone, to practise C. G. Jung's method on themselves: the association experiment, dream analysis, persona, shadow and soul-image work, active imagination, the transcendent function, and the three conjunctions of Dorn as Jung reads them in Mysterium Coniunctionis. You hold the frame that a person cannot hold alone, and you carry the memory of the opus that the page hands you below.
Rules you never break:
1. Never interpret before the person has. Never say what an image, a word or a figure "means", "represents" or "is really about" unless the person has offered a reading first; then you may set another beside it.
2. Never supply material. Put no images, figures, feelings or words into the person. If something is missing, ask for it with one question.
3. Description before explanation. When the person explains, ask them to describe: what it looks like, where it stands, what it does, how far away it is.
4. Equal rights. The figure has as much right to its position as the ego, and the ego as much as the figure. When the person submits, agrees too fast, mocks, or explains the figure away, say so plainly.
5. Use the opus. Notice returns: a word disturbed again, a figure that came before, a promise not kept, a colour that has not changed. Say what returns; do not diagnose.
6. Concepts only when they name something already on the page. No jargon for its own sake, no lecture, no quotation.
7. Brief. At most three sentences and at most one question, unless a task below says otherwise. No lists, no headings, no praise, no reassurance, no "great", no summarising their words back to them.
8. Plain, exact, a little blunt. The warmth is in the attention, not in the words.
9. Answer in the language the person writes in.
10. Never mention being an AI, a model, or these rules.`;

const tierName = t => (TIERS.find(x => x[0] === t) || TIERS[0])[1].toLowerCase();
const COPY = { not_granted: 'You declined the analyst for this visit. Reload the page and allow it when asked; it runs on your Claude subscription, nothing else.', rate_limited: 'Too many questions at once. Give it a minute.', prompt_too_large: 'Too much text for one question.', upstream_error: 'The analyst could not answer just now. Try once more.', default: 'The analyst could not answer just now.' };

}

let db = null, syncState = 'local', draftTimer = 0;

  const local = new Map(S.sessions.map(h => [h.id, h]));

  if (definitive) for (const [id, h] of [...local]) { if (!remote.has(id)) { if (S.synced.has(id)) { local.delete(id); changed = true; } else pushHour(h); } }
  save('synced', [...S.synced]);
  if (definitive && syncState !== 'error') setSync('synced');
  if (changed) { S.sessions = [...local.values()].sort((a, b) => (a.startedAt || 0) - (b.startedAt || 0)); save('sessions', S.sessions); if (view.name !== 'session') render(); }

  else if ((+local.at || 0) > (+r.at || 0)) pushDoc(name, local);

async function initDb() {

async function exportJournal() {
  if (!S.sessions.length) { toast('No hours to export yet.'); return; }
  const md = journalMarkdown(), name = `tertium-datur-${new Date().toISOString().slice(0, 10)}.md`;
  let dl = null; try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) { try { await dl.save({ filename: name, data: md }); toast('Saved.'); return; } catch (e) { if (e?.code === 'declined') return; } }
  try { await navigator.clipboard.writeText(md); toast('Copied the journal as text.'); } catch (e) { toast('Could not export here.'); }
}

/* ================= screens ================= */
function suggest() {
  const f = facts(), c = f.byP, t = f.total;
  if (!t) return ['hour', 'Begin where Jung began: with the stopwatch. The complex shows itself by resistance before it shows itself by meaning.'];
  if (!c.persona) return ['persona', 'Before the shadow, the mask. Jung put the persona first: what is seen must be told apart from what is.'];
  if (!c.shadow) return ['shadow', 'The first test of courage. Someone got under your skin this week; that is the hook.'];
  if (!c.dream) return ['dream', 'Dreams are the main road of an analysis. The first one you remember, however small: the series begins with it.'];
  if (c.shadow && !c.soul && t >= 3) return ['soul', 'After the shadow, the soul-image: the figure that carries the projection now. Jung called this the master-piece.'];
  if (t >= 4 && !c.mandala) return ['mandala', 'Draw one. The centre and the four tell you where the opus stands better than any summary.'];
  if (t >= 6 && !c.unio) return ['unio', 'Enough material has gathered. The first conjunction reads the whole file and distils it.'];
  if (c.unio && !c.corpus) return ['corpus', 'The caelum exists. Now it must be returned to the body, or it stays a thought.'];
  if (c.corpus && !c.mundus) return ['mundus', 'The last conjunction: the whole of it, and the one world.'];
  const last = S.sessions[S.sessions.length - 1];
  if (last && last.practice !== 'hour') return ['hour', 'Circle again. The stopwatch will say whether the word that disturbed you before still does.'];
  return ['dream', 'Another dream, when you have one. The series is what shows the direction; a single dream shows only a state.'];
}

      : `<div class="card"><span class="nm">Suggested next</span><span class="latin">${esc(P.name)} · ${esc(P.latin)}</span><p>${esc(why)}</p><button class="btn primary begin" data-act="begin" data-p="${sg}">Begin ${esc(P.name)}</button>${sg !== 'dream' ? `<div class="row" style="justify-content:center;margin-top:4px"><button class="ghost" data-act="begin" data-p="dream">Dreamt? Record it first</button></div>` : ''}</div>`}

    <div class="row" style="justify-content:space-between"><button class="ghost" data-act="liber">Open the Liber</button><button class="ghost" data-act="export">Export</button></div>
    <h3 class="label">The practices</h3>
    <ol class="practices">${practiceList.slice(0, 6).join('')}</ol>
    <h3 class="label group">Mysterium coniunctionis</h3>
    <p class="sub small">Dorn’s three conjunctions, as Jung reads them in CW 14: the end of the opus, walked when the file is full enough to be distilled.</p>
    <ol class="practices">${practiceList.slice(6).join('')}</ol>
    <details class="method"><summary><span class="label" style="margin:0">Why it is built this way</span></summary>
      <p><b>Self-analysis usually fails</b> because the ego does the analysing: it explains, chooses, interprets, and stays in charge. Jung’s method needs the ego to step back at some points and to stand its ground at others. Alone, nobody enforces the difference. This instrument does, by its sequence, and by remembering: every threshold asks about the last promise, figures return, and a word disturbed twice is named as such.</p>
      <p><b>The association experiment</b> (CW 2) finds complexes by their effects, not by introspection. <b>Dreams</b> are worked as Jung worked them: exact text, dramatic structure, associations by circumambulation, the subjective level, compensation, your reading before any other. <b>Persona, shadow, soul-image</b> follow the order of CW 7 and CW 9ii. <b>Active imagination</b> asks for description before meaning and for a dialogue with equal rights. <b>The transcendent function</b> (CW 8 §§131–193) arises from bearing the tension; the minute of holding is the method. <b>Mandalas</b> are drawn, not admired.</p>
      <p><b>The three conjunctions</b> are Gerhard Dorn’s, as Jung reads them at the end of Mysterium Coniunctionis (CW 14): unio mentalis, the reunion with the body, and the unus mundus. They are practised here as three hours that read the whole file, return its distillate to the flesh, and ask for the symbol of the whole. The opus does not end there; it circles.</p>
      <p><b>The analyst</b> is a voice from Claude that holds the frame and carries the memory of the opus into every question. It never interprets before you do and never supplies material. It runs through the Claude app you open this page in, on your subscription’s usage, with no key of its own. Your hours are kept in the private store this page has in your Claude account, and cached on the device you use.</p>
    </details>
    ${quote(n ? (f.byP.mundus ? 'individuation' : 'soul') : 'alone')}
    <h3 class="label analyst-only">The analyst thinks</h3>
    <div class="chips analyst-only">${TIERS.map(([k, l]) => `<button class="chip gold ${(S.prefs.tier || 'complex') === k ? 'on' : ''}" data-act="tier" data-t="${k}">${l}</button>`).join('')}</div>
    <p class="sub small analyst-only">Deepest asks for the most capable model your Claude plan offers and lets it think at length before it speaks; an answer can take a minute. Balanced is the everyday model. Quick answers in seconds without thinking first. Each answer says which tier actually replied.</p>

  </main></div>`;
}

  const dreams = f.dreams.map(x => `<div class="item"><span class="nm"><span class="mono">${fmtDate(x.at)}</span></span><p>${esc(x.elements.join(' · '))}</p><p><i>${esc(x.message)}</i></p><div class="row" style="margin-top:6px"><button class="ghost" data-act="open" data-id="${x.id}">Open</button></div></div>`).join('');

  const hours = [...S.sessions].reverse().map(s => `<button class="entry" data-act="open" data-id="${s.id}"><span class="date">${fmtDate(s.startedAt)}</span><span class="seed">${esc(PRACTICES[s.practice].name)}</span><span class="third">${colourDot(s.data?.colour)}${esc((s.data?.seed?.word || s.data?.figure || s.data?.message || s.data?.caelum || '').slice(0, 80))}</span></button>`).join('');

    <h2 class="prompt">The Liber.</h2><p class="sub small">Everything the opus has recorded, gathered. Jung kept his in a red book; this is the same idea with a stopwatch.</p>
    <h3 class="label">The opus</h3>
    <div class="opusline" style="justify-content:flex-start">${f.colours.map(c => `<i style="background:var(${COLOUR_VAR[c]})" title="${c}"></i>`).join('') || '<span class="sub small">no hours yet</span>'}</div>

    ${f.whole ? `<h3 class="label">The symbol of the whole</h3><div class="leaf"><p class="third">${esc(f.whole)}</p></div>` : ''}
    <h3 class="label">Portrait</h3>
    <p class="sub small">Typology after CW 6. The inferior function is the door through which the unconscious enters; the analyst reads the material with this in mind. The second half of life, in Jung’s sense, begins around forty, when the programme of the morning stops working.</p>
    <div class="chips">${chip('attitude', 'introverted', 'Introverted')}${chip('attitude', 'extraverted', 'Extraverted')}</div>

}
function Entry(id) {
  const s = S.sessions.find(x => x.id === id); if (!s) { view = { name: 'home' }; return Home(); }
  const w = s.data?.wae, rows = w?.done ? w.items.map((it, i) => `<tr class="d${Math.min(2, it.flags.length)}"><td>${i + 1}</td><td>${esc(wordOf(s, it))}</td><td>${esc(it.resp || '—')}</td><td class="rt">${secs(it.rt)}</td><td>${it.reproOk ? (it.reproNear ? '≈' : '·') : esc(it.repro || '—')}</td><td class="fl">${esc(flagCell(it))}</td></tr>`).join('') : '';
  return `<div class="shell"><header class="top"><button class="ghost" data-act="home">‹ Opus</button><div class="stage" style="text-align:right">${esc(PRACTICES[s.practice].name)} · <span class="mono">${fmtDate(s.startedAt)}</span></div></header><main class="screen">
    ${leaf(s, true)}
    ${rows ? `<details><summary><span class="label" style="margin:0">Association protocol</span></summary><div class="tablewrap"><table class="protocol"><tr><th>#</th><th>word</th><th>answer</th><th>s</th><th>again</th><th></th></tr>${rows}</table></div><p class="legend">median ${secs(w.median)} s · threshold ${secs(w.thr)} s · ${KEY_TEXT}</p></details>` : ''}
    ${['constellation', 'reading', 'amplification', 'distill'].filter(k => s.analyst?.[k]).map(k => `<div class="analyst"><span class="who">The analyst · ${k}</span><p>${esc(s.analyst[k])}</p></div>`).join('')}
    <div class="foot"><button class="ghost" data-act="delete" data-id="${s.id}">Delete this hour</button></div>
  </main></div>`;
}
function prevStep(d) { const all = stepsOf(d.practice); const i = all.findIndex(s => s.mi === d.mi && s.si === d.si); for (let j = i - 1; j >= 0; j--) if (applies(all[j], d)) return all[j]; return null; }
function Session() {
  const d = S.draft, P = PRACTICES[d.practice], mv = P.movements[d.mi], st = mv.steps[d.si];
  const b = STEP[st.type](st, d);
  const canBack = d.si + d.mi > 0 && !['wae', 'repro', 'protocol', 'hold'].includes(st.type) && !['wae', 'repro'].includes(prevStep(d)?.type);
  return `<div class="shell session"><header class="top">${ring(d.mi, P.movements.length)}<div class="stage">${ROMAN[d.mi]} · ${esc(mv.label)}<span style="color:var(--text-3)"> · ${esc(P.name)}</span></div>${canBack ? `<button class="ghost" data-act="back" aria-label="Back">‹</button>` : ''}<button class="ghost" data-act="pause">Pause</button></header><main class="screen">${b.main}</main><footer class="bar">${b.bar || ''}</footer></div>`;
}

/* ================= navigation ================= */
function newDraft(practice) { return { id: Date.now().toString(36), practice, startedAt: Date.now(), mi: 0, si: 0, data: {}, analyst: {}, dlgWho: 'I', dlgDraft: '', ei: 0 }; }
function advance() {
  const d = S.draft, P = PRACTICES[d.practice], st = curStep(d);
  if (st.type === 'each') { const items = D(d, st.from, []); if ((d.ei || 0) < items.length - 1) { d.ei = (d.ei || 0) + 1; saveDraft(); render(); return; } d.ei = 0; }
  if (st.type === 'sync') { const items = D(d, 'sync', []); if (items.length) { S.sync = { at: Date.now(), items: [...S.sync.items, ...items.map(t => ({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), at: Date.now(), text: t }))] }; save('synclog', S.sync); pushDoc('synclog', S.sync); d.data.syncAdded = [...(d.data.syncAdded || []), ...items]; d.data.sync = []; } }
  let mi = d.mi, si = d.si + 1;
  for (;;) { if (si >= P.movements[mi].steps.length) { mi++; si = 0; if (mi >= P.movements.length) return; } const nx = P.movements[mi].steps[si]; if (applies(nx, d)) break; si++; }
  d.mi = mi; d.si = si; saveDraft(true); render();
}
function goBack() { const d = S.draft, p = prevStep(d); if (!p) return; d.mi = p.mi; d.si = p.si; if (p.type === 'each') d.ei = Math.max(0, D(d, p.from, []).length - 1); saveDraft(); render(); }
const act = {
  begin(b) { S.draft = newDraft(b.dataset.p || 'hour'); saveDraft(true); view = { name: 'session' }; render(); },
  resume() { view = { name: 'session' }; render(); },
  discard(b) { if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Really discard this hour?'; return; } S.draft = null; saveDraft(true); view = { name: 'home' }; render(); },
  pause() { view = { name: 'home' }; render(); },
  home() { view = { name: 'home' }; render(); },
  liber() { view = { name: 'liber' }; render(); },
  open(b) { view = { name: 'entry', id: b.dataset.id }; render(); },
  delete(b) { if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Really delete? It cannot be recovered.'; return; } S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); save('sessions', S.sessions); removeHour(b.dataset.id); view = { name: 'home' }; render(); },
  export() { exportJournal(); },
  lang() { S.prefs.lang = S.prefs.lang === 'de' ? 'en' : 'de'; save('prefs', S.prefs); render(); },
  tier(b) { S.prefs.tier = b.dataset.t; save('prefs', S.prefs); render(); },
  portrait(b) { S.portrait = { ...S.portrait, [b.dataset.f]: S.portrait[b.dataset.f] === b.dataset.v ? '' : b.dataset.v, at: Date.now() }; save('portrait', S.portrait); pushDoc('portrait', S.portrait); render(); },
  'sync-add'() { const t = (document.getElementById('sync-in')?.value || '').trim(); if (!t) return; S.sync = { at: Date.now(), items: [...S.sync.items, { id: Date.now().toString(36), at: Date.now(), text: t }] }; save('synclog', S.sync); pushDoc('synclog', S.sync); render(); },
  next() { const d = S.draft; if (!ready(curStep(d), d)) return; advance(); },
  back() { goBack(); },
  set(b) { const d = S.draft, cur = getPath(d.data, b.dataset.f); setPath(d.data, b.dataset.f, cur === b.dataset.v && b.dataset.f !== 'colour' ? '' : b.dataset.v); saveDraft(); render(); },
  promise(b) { const d = S.draft; d.data.promise = { ...(d.data.promise || {}), of: openPromise(d).of, status: b.dataset.v }; saveDraft(); render(); },
  affect(b) { S.draft.data.affect.word = b.dataset.w; S.draft.data.affect.custom = ''; saveDraft(); render(); },
  intensity(b) { S.draft.data.affect.intensity = +b.dataset.n; saveDraft(); render(); },
  body(b) { const a = S.draft.data.affect; a.body = a.body === b.dataset.w ? '' : b.dataset.w; saveDraft(); render(); },
  'wae-lang'(b) { S.draft.data.wae.lang = b.dataset.l; S.prefs.lang = b.dataset.l; save('prefs', S.prefs); saveDraft(); render(); },
  'wae-mode'(b) { const d = S.draft; if (curStep(d).type === 'waeIntro') { d.data.wae.mode = b.dataset.m; S.prefs.mode = b.dataset.m; save('prefs', S.prefs); saveDraft(); render(); } else switchMode(b.dataset.m); },
  'wae-next'() { const inp = document.getElementById('wae-in'), typed = S.draft?.data.wae.mode === 'type'; waeCommit(inp.value); if (typed) inp.focus(); },
  'wae-none'() { const inp = document.getElementById('wae-in'), typed = S.draft?.data.wae.mode === 'type'; waeCommit(''); if (typed) inp.focus(); },
  seed(b) { const d = S.draft, ix = +b.dataset.ix; d.data.seed = ix < 0 ? { word: affectWord(d), source: 'affect' } : { word: wordOf(d, d.data.wae.items[ix]), source: 'wae', ix }; saveDraft(); render(); },
  'figure-return'(b) { const d = S.draft; if (d.data.figure === b.dataset.n && d.data.figureReturn) { d.data.figureReturn = false; } else { d.data.figure = b.dataset.n; d.data.figureReturn = true; } saveDraft(); render(); },
  who(b) { S.draft.dlgWho = b.dataset.w; saveDraft(); render(); },
  'dlg-add'() { const d = S.draft, t = (document.getElementById('dlg-in')?.value || '').trim(); if (!t) return; d.data.dialogue.push({ who: d.dlgWho, text: t }); d.dlgWho = d.dlgWho === 'I' ? 'F' : 'I'; d.dlgDraft = ''; saveDraft(); render(); },
  nothing() { const d = S.draft; d.data.nothing = true; advance(); },
  'list-add'(b) { const d = S.draft, inp = document.getElementById('list-in'), t = (inp?.value || '').trim(); if (!t) return; const f = b.dataset.f, arr = D(d, f, []); const st = curStep(d); if (st.max && arr.length >= st.max) return; setPath(d.data, f, [...arr, t]); saveDraft(); render(); },
  'list-remove'(b) { const d = S.draft, f = b.dataset.f, arr = D(d, f, []); arr.splice(+b.dataset.i, 1); setPath(d.data, f, [...arr]); saveDraft(); render(); },
  'pad-colour'(b) { S.draft.padColour = b.dataset.c; document.querySelectorAll('.palette .sw').forEach(x => x.classList.toggle('on', x.dataset.c === b.dataset.c)); },
  'pad-undo'() { const d = S.draft, st = curStep(d), data = getPath(d.data, st.field); if (data?.strokes?.length) { data.strokes.pop(); saveDraft(); const cv = document.getElementById('pad'); if (cv) paintStrokes(cv, data); refreshReady(); } },
  'pad-clear'() { const d = S.draft, st = curStep(d); setPath(d.data, st.field, { strokes: [] }); saveDraft(); const cv = document.getElementById('pad'); if (cv) { paintStrokes(cv, getPath(d.data, st.field)); } refreshReady(); render(); },
  ask(b) { ask(b.dataset.kind); },
  stop() { ctl?.abort(); },
  keep() {
    const d = S.draft; d.finishedAt = Date.now(); delete d.dlgDraft; delete d.ei; delete d.padColour;
    S.sessions.push(d); S.sessions.sort((a, b) => a.startedAt - b.startedAt); save('sessions', S.sessions); pushHour(d); S.draft = null; saveDraft(true);
    view = { name: 'home' }; render(); toast(d.practice === 'mundus' ? 'The hour is kept. The circle closed, and opens again.' : 'The hour is kept. The mandala has grown.');
  }
};
app.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const fn = act[b.dataset.act]; if (fn) fn(b, e); });
app.addEventListener('input', e => {
  const f = e.target.dataset?.field; if (!f || !S.draft) return; const d = S.draft;
  if (f === 'dlgDraft') { d.dlgDraft = e.target.value; saveDraft(); return; }
  setPath(d.data, f, e.target.value); saveDraft();
  const st = curStep(d);
  if (st.type === 'text') { const nudge = document.getElementById('nudge'); const re = st.nudge ? NUDGE_RE : st.nudgeRe; if (nudge && re) nudge.hidden = !re.test(e.target.value); }
  refreshReady();
});
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'wae-in') { e.preventDefault(); waeCommit(e.target.value); }
  else if (e.target.id === 'list-in' && e.target.tagName === 'INPUT') { e.preventDefault(); const b = app.querySelector('[data-act="list-add"]'); if (b) act['list-add'](b); }
  else if (e.target.id === 'f-figure') { e.preventDefault(); act.next(); }
});
app.addEventListener('keydown', e => { if (e.target.id === 'wae-in' && e.key.length === 1) markFirst('type'); }, true);
app.addEventListener('input', e => { if (e.target.id === 'wae-in' && e.target.value && e.isTrusted) { markFirst('type'); timers.forEach(clearTimeout); timers = []; } }, true);

/* ================= render ================= */
function afterRender() {
  const d = S.draft;
  paintAll();
  if (view.name === 'home') { animateMandala(); return; }
  if (view.name !== 'session' || !d) return;
  const st = curStep(d);
  if (st.type === 'breathe') later(() => document.getElementById('go')?.classList.add('show'), reduced ? Math.min(10000, st.seconds * 500) : st.seconds * 1000);
  if (st.type === 'wae' || st.type === 'repro') { if (d.data.wae.mode !== 'voice') document.getElementById('wae-in')?.focus(); waeShow(); }
  if (st.type === 'dialogue') { const c = document.getElementById('composer'); if (d.data.dialogue?.length) c?.scrollIntoView({ block: 'start', behavior: reduced ? 'auto' : 'smooth' }); }
  if (st.type === 'hold') later(() => { document.getElementById('go')?.classList.add('show'); document.getElementById('reveal2')?.classList.add('show'); }, reduced ? 30000 : 61000);
  if (st.type === 'draw') { const cv = document.getElementById('pad'); if (cv) initPad(cv, d, st.field); }
  if (st.type === 'list') document.getElementById('list-in')?.focus();
}
function render() {
  cancelAnimationFrame(raf); timers.forEach(clearTimeout); timers = []; stopListening();
  if (view.name === 'session' && !S.draft) view = { name: 'home' };
  app.innerHTML = view.name === 'home' ? Home() : view.name === 'entry' ? Entry(view.id) : view.name === 'liber' ? Liber() : Session();
  window.scrollTo(0, 0);
  afterRender();
}
render();
initAnalyst();
initDb();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (view.name === 'home') animateMandala(); else paintAll(); });
window.__tertium = { S, act, render, PRACTICES, curStep, ready, facts, advance, stepsOf, analyze, view: () => view, setView: v => { view = v; } };
})();
</script>
