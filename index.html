    <p>If any of them is true, the confession, the persona, and the dream may still be walked, slowly, and a person should know you are doing it. If the images will not stop when you want them to, if you cannot tell them from the room, or if you are frightened: close this and telephone a person. In Switzerland, 143 (Die Dargebotene Hand) at any hour, 144 in an emergency; elsewhere, your local emergency number.</p>
    <p>The vessel must be closed. Choose one person who knows you are doing this, and no more; material told everywhere evaporates, and the alchemists sealed the flask for that reason. Every tenth hour you will be asked who you have told. Coincidences that meant something can be logged in the Liber from the first day; the third conjunction needs half a year of them.</p>
    <p>You will be asked about what you undertake, and the record keeps what you abandon. Both are material, not marks. This page is shown again before a deep practice every ninety days.</p>
    <div class="row"><button class="btn primary" data-act="gate-ok" data-p="${esc(p || '')}">I have read this</button></div>
  </main></div>`;
}

  portrait(b) { const f = b.dataset.f, v = S.portrait[f] === b.dataset.v ? '' : b.dataset.v; S.portrait = { ...S.portrait, [f]: v, at: Date.now() }; if (f === 'inferior') S.portrait.auxiliary = ''; save('portrait', S.portrait); pushDoc('portrait', S.portrait); render(); },
  'sync-add'() { const g = id => (document.getElementById(id)?.value || '').trim(); const e = { inner: g('sync-inner'), outer: g('sync-outer'), why: g('sync-why') }; if (!e.inner && !e.outer) return; if (tripCheck(e.inner + ' ' + e.outer + ' ' + e.why)) return; S.sync = { at: Date.now(), items: [...S.sync.items, { ...e, id: Date.now().toString(36), at: Date.now() }] }; save('synclog', S.sync); pushDoc('synclog', S.sync); render(); },
  'sync-entry'() { const d = S.draft, e = d.syncEntry || {}; if (!(e.inner || '').trim() && !(e.outer || '').trim()) return; setPath(d.data, 'sync', [...D(d, 'sync', []), { inner: (e.inner || '').trim(), outer: (e.outer || '').trim(), why: (e.why || '').trim() }]); d.syncEntry = {}; saveDraft(); render(); },
  next() { const d = S.draft; if (!ready(curStep(d), d)) return; advance(); },
  back() { goBack(); },
  set(b) { const d = S.draft, cur = getPath(d.data, b.dataset.f); setPath(d.data, b.dataset.f, cur === b.dataset.v ? '' : b.dataset.v); saveDraft(); render(); },
  op(b) { const d = S.draft, ops = d.data.ops || []; const v = b.dataset.v; d.data.ops = ops.includes(v) ? ops.filter(x => x !== v) : [...ops, v].slice(-2); saveDraft(); render(); },
  promise(b) { const d = S.draft; d.data.promise = { ...(d.data.promise || {}), of: openPromise(d).of, status: b.dataset.v }; saveDraft(); render(); },
  thirdcheck(b) { const d = S.draft; d.data.thirdCheck = { ...(d.data.thirdCheck || {}), of: openThird(d).of, status: b.dataset.v }; saveDraft(); render(); },
  thirddied(b) { const d = S.draft; d.data.thirdCheck = { ...(d.data.thirdCheck || {}), died: b.dataset.v }; saveDraft(); render(); },
  tensioncheck(b) { const d = S.draft; d.data.tensionCheck = { ...(d.data.tensionCheck || {}), of: openTension(d).of, status: b.dataset.v }; saveDraft(); render(); },
  expressive(b) { const d = S.draft, w = d.data.wae, i = +b.dataset.i; w.expressive = (w.expressive || []).includes(i) ? w.expressive.filter(x => x !== i) : [...(w.expressive || []), i]; saveDraft(); render(); },
  affect(b) { S.draft.data.affect.word = b.dataset.w; S.draft.data.affect.custom = ''; saveDraft(); render(); },
  intensity(b) { S.draft.data.affect.intensity = +b.dataset.n; saveDraft(); render(); },
  body(b) { const a = S.draft.data.affect; a.body = a.body === b.dataset.w ? '' : b.dataset.w; saveDraft(); render(); },
  'wae-lang'(b) { S.draft.data.wae.lang = b.dataset.l; S.prefs.lang = b.dataset.l; save('prefs', S.prefs); saveDraft(); render(); },
  'wae-mode'(b) { const d = S.draft; if (curStep(d).type === 'waeIntro') { d.data.wae.mode = b.dataset.m; S.prefs.mode = b.dataset.m; save('prefs', S.prefs); saveDraft(); render(); } else switchMode(b.dataset.m); },
  'wae-next'() { const inp = document.getElementById('wae-in'), typed = S.draft?.data.wae.mode === 'type'; waeCommit(inp.value); if (typed) inp.focus(); },
  'wae-none'() { const inp = document.getElementById('wae-in'), typed = S.draft?.data.wae.mode === 'type'; waeCommit(''); if (typed) inp.focus(); },
  seed(b) { const d = S.draft, ix = +b.dataset.ix; d.data.seed = ix < 0 ? { word: affectWord(d), source: 'affect' } : { word: wordOf(d, d.data.wae.items[ix]), source: 'wae', ix }; saveDraft(); render(); },
  'figure-return'(b) { const d = S.draft; if (d.data.figure === b.dataset.n && d.data.figureReturn) { d.data.figureReturn = false; } else { d.data.figure = b.dataset.n; d.data.figureReturn = true; } saveDraft(); render(); },
  who(b) { S.draft.dlgWho = b.dataset.w; saveDraft(); render(); },
  'dlg-add'() { const d = S.draft, t = (document.getElementById('dlg-in')?.value || '').trim(); if (!t) return; d.data.dialogue.push({ who: d.dlgWho, text: t }); d.dlgWho = d.dlgWho === 'I' ? 'F' : 'I'; d.dlgDraft = ''; saveDraft(); render(); },
  nothing() { const d = S.draft; d.data.nothing = true; advance(); },
  'list-add'(b) { const d = S.draft, inp = document.getElementById('list-in'), t = (inp?.value || '').trim(); if (!t) return; if (tripCheck(t)) return; const f = b.dataset.f, arr = D(d, f, []); const st = curStep(d); if (st.max && arr.length >= st.max) return; setPath(d.data, f, [...arr, t]); saveDraft(); render(); },
  'list-remove'(b) { const d = S.draft, f = b.dataset.f, arr = D(d, f, []); arr.splice(+b.dataset.i, 1); setPath(d.data, f, [...arr]); saveDraft(); render(); },
  'pad-colour'(b) { S.draft.padColour = b.dataset.c; document.querySelectorAll('.palette .sw').forEach(x => x.classList.toggle('on', x.dataset.c === b.dataset.c)); },
  'pad-undo'() { const d = S.draft, st = curStep(d), data = getPath(d.data, st.field); if (data?.strokes?.length) { data.strokes.pop(); saveDraft(); const cv = document.getElementById('pad'); if (cv) paintStrokes(cv, data); refreshReady(); } },
  'pad-clear'() { const d = S.draft, st = curStep(d); setPath(d.data, st.field, { strokes: [] }); saveDraft(); render(); },
  ask(b) { ask(b.dataset.kind); },
  stop() { ctl?.abort(); },
  talk() { view = { name: 'talk' }; render(); },
  'talk-send'() { talkSend(document.getElementById('talk-in')?.value); },
  'talk-new'() { const t = currentTalk(); if (t) { t.closed = true; saveTalks(); } talkDraft = ''; render(); },
  'memory-prompt'() { const ok = () => toast('Copied. Paste it into a Claude chat, then paste the answer here.'); if (navigator.clipboard?.writeText) navigator.clipboard.writeText(MEMORY_PROMPT).then(ok, () => toast('Could not copy here; the prompt is written out below.')); else toast('Could not copy here; the prompt is written out below.'); },
  keep() {
    const d = S.draft; d.finishedAt = Date.now(); d.updatedAt = Date.now(); delete d.dlgDraft; delete d.ei; delete d.padColour; delete d.syncEntry; delete d.tripShow; delete d.deepClosed; delete d.tripMatch;
    if (d.data.ops?.length) d.data.colour = colourFrom(d.data.ops, d.data.colourPick, d) || admitted(d.data.ops, d)[0];
    if (gapDays(d) > 21) d.data.gap = { ...(d.data.gap || {}), days: Math.round(gapDays(d)) };
    if (d.data.thirdCheck?.status === 'alive' && d.data.thirdCheck.died === 'yes') { const e = S.sessions.find(h => h.id === d.data.thirdCheck.of); if (e && e.data) { if (e.data.two === 'merged') { e.data.two = 'both'; d.data.thirdCheck.died = 'seam'; e.updatedAt = Date.now(); pushHour(e); } else if (statusOf(e) !== 'not' && e.data.two === 'both') { e.data.colour = 'rubedo'; e.updatedAt = Date.now(); pushHour(e); } } }
    S.sessions.push(d); S.sessions.sort((a, b) => a.startedAt - b.startedAt); save('sessions', S.sessions); pushHour(d);
    S.draft = null; saveDraft(true);
    view = { name: 'home' }; render(); toast(d.practice === 'mundus' ? 'The hour is kept. The circle closed, and opens again.' : 'The hour is kept.');
  }
};
app.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const fn = act[b.dataset.act]; if (fn) fn(b, e); });
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset?.circ) { S.portrait = { ...S.portrait, circ: { ...(S.portrait.circ || {}), [t.dataset.circ]: t.value }, at: Date.now() }; save('portrait', S.portrait); clearTimeout(app._pt); app._pt = setTimeout(() => pushDoc('portrait', S.portrait), 1200); if (tripCheck(t.value)) return; refreshReady(); return; }
  if (t.dataset?.mem) { S.memory = { ...S.memory, [t.dataset.mem]: t.value, at: Date.now() }; save('memory', S.memory); clearTimeout(app._mt); app._mt = setTimeout(() => pushDoc('memory', S.memory), 1200); if (t.dataset.mem === 'context' && tripCheck(t.value)) return; return; }
  if (t.id === 'talk-in') { talkDraft = t.value; return; }
  if (t.id === 'sync-inner' || t.id === 'sync-outer' || t.id === 'sync-why' || t.id === 'list-in') { if (tripCheck(t.value)) return; }
  const f = t.dataset?.field; if (!f || !S.draft) return; const d = S.draft;
  if (f === 'dlgDraft') { d.dlgDraft = t.value; saveDraft(); }
  else if (f.startsWith('_syncEntry.')) { d.syncEntry = { ...(d.syncEntry || {}), [f.slice(11)]: t.value }; saveDraft(); }
  else { setPath(d.data, f, t.value); saveDraft(); }
  if (tripCheck(t.value)) return;
  if (f.startsWith('_syncEntry.')) return;
  const st = curStep(d);
  if (st.type === 'text') { const nudge = document.getElementById('nudge'); const re = st.nudge ? NUDGE_RE : st.nudgeRe; if (nudge && re) nudge.hidden = !re.test(t.value); }
  refreshReady();
});
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'wae-in') { e.preventDefault(); waeCommit(e.target.value); }
  else if (e.target.id === 'list-in' && e.target.tagName === 'INPUT') { e.preventDefault(); const b = app.querySelector('[data-act="list-add"]'); if (b) act['list-add'](b); }
  else if (e.target.id === 'f-figure') { e.preventDefault(); act.next(); }
});
app.addEventListener('keydown', e => { if (e.target.id === 'wae-in' && e.key.length === 1) markFirst('type'); }, true);
app.addEventListener('input', e => { if (e.target.id === 'wae-in' && e.target.value && e.isTrusted) { markFirst('type'); timers.forEach(clearTimeout); timers = []; } }, true);

/* ================= render ================= */
function afterRender() {
  const d = S.draft;
  paintAll();
  if (view.name === 'home') { animateMandala(); return; }
  if (view.name === 'talk') { const c = document.getElementById('talk-in'); if (c && currentTalk()?.turns?.length) c.scrollIntoView({ block: 'end', behavior: reduced ? 'auto' : 'smooth' }); return; }
  if (view.name !== 'session' || !d) return;
  const st = curStep(d);
  if (st.type === 'breathe') later(() => document.getElementById('go')?.classList.add('show'), reduced ? Math.min(10000, st.seconds * 500) : st.seconds * 1000);
  if (st.type === 'wae' || st.type === 'repro') { if (d.data.wae.mode !== 'voice') document.getElementById('wae-in')?.focus(); waeShow(); }
  if (st.type === 'dialogue') { const c = document.getElementById('composer'); if (d.data.dialogue?.length) c?.scrollIntoView({ block: 'start', behavior: reduced ? 'auto' : 'smooth' }); }
  if (st.type === 'hold') later(() => { document.getElementById('go')?.classList.add('show'); document.getElementById('reveal2')?.classList.add('show'); }, reduced ? 30000 : 61000);
  if (st.type === 'draw') { const cv = document.getElementById('pad'); if (cv) initPad(cv, d, st.field); }
  if (st.type === 'list') document.getElementById('list-in')?.focus();
}
function render() {
  cancelAnimationFrame(raf); timers.forEach(clearTimeout); timers = []; stopListening();
  if (view.name === 'session' && !S.draft) view = { name: 'home' };
  app.innerHTML = view.name === 'home' ? Home() : view.name === 'entry' ? Entry(view.id) : view.name === 'liber' ? Liber() : view.name === 'talk' ? Talk() : view.name === 'gate' ? Gate(view.p) : view.name === 'ground' ? Ground() : Session();
  window.scrollTo(0, 0);
  afterRender();
}
render();
initAnalyst();
initDb();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (view.name === 'home') animateMandala(); else paintAll(); });
window.__tertium = { S, act, render, PRACTICES, curStep, ready, facts, advance, stepsOf, analyze, lockOf, suggest, newDraft, openPromise, openThird, openTension, contextFor, hourText, dossierText, handedText, analyst: () => analyst, initAnalyst, view: () => view, setView: v => { view = v; } };
})();
</script>
