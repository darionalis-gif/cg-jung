<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Tertium Datur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Marcellus&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0B0F1A; --ground-2:#121829; --ground-3:#1A2237;
  --line:#283048; --line-2:#3A4363;
  --text:#E9E3D3; --text-2:#A8A9B8; --text-3:#6F758C;
  --verm:#DC4A22; --verm-soft:rgba(220,74,34,.16); --on-verm:#FBF5E8;
  --gold:#CFA850; --gold-soft:rgba(207,168,80,.14);
  --lapis:#7A97E6; --lapis-soft:rgba(122,151,230,.14);
  --focus:#F1C76C; --mandala-l:62%; --blend:screen;
  --serif:'Cardo','Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --caps:'Marcellus','Cardo',Georgia,serif;
  --mono:'Courier Prime','Courier New',Courier,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --ground:#E9EAEF; --ground-2:#F4F4F7; --ground-3:#FFFFFF;
    --line:#CFD2DC; --line-2:#B3B8C8;
    --text:#141826; --text-2:#4F5568; --text-3:#7C8196;
    --verm:#C2361A; --verm-soft:rgba(194,54,26,.10); --on-verm:#FBF5E8;
    --gold:#8C6C1F; --gold-soft:rgba(140,108,31,.12);
    --lapis:#2C4DA3; --lapis-soft:rgba(44,77,163,.10);
    --focus:#8C6C1F; --mandala-l:42%; --blend:multiply;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#E9EAEF; --ground-2:#F4F4F7; --ground-3:#FFFFFF;
  --line:#CFD2DC; --line-2:#B3B8C8;
  --text:#141826; --text-2:#4F5568; --text-3:#7C8196;
  --verm:#C2361A; --verm-soft:rgba(194,54,26,.10); --on-verm:#FBF5E8;
  --gold:#8C6C1F; --gold-soft:rgba(140,108,31,.12);
  --lapis:#2C4DA3; --lapis-soft:rgba(44,77,163,.10);
  --focus:#8C6C1F; --mandala-l:42%; --blend:multiply;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:var(--serif); font-size:18px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--gold)}

.shell{max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
.screen{flex:1; padding:18px 22px 28px}
.top{display:flex; align-items:center; gap:12px; padding:14px 22px 0}
.top .stage{flex:1}
.ring{flex:none}
.bar{
  position:sticky; bottom:0; display:flex; gap:10px; align-items:center;
  padding:12px 22px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--ground) 72%, transparent);
}
.bar .btn.primary{flex:1}
.bar:empty{display:none}

.stage, .label, .who, .eyebrow{
  font-family:var(--caps); text-transform:uppercase; letter-spacing:.22em;
  font-size:12px; color:var(--text-2);
}
.label{margin:26px 0 10px}
.prompt{
  font-family:var(--serif); font-weight:400; font-size:28px; line-height:1.22;
  text-wrap:balance; margin:10px 0 12px;
}
.sub{color:var(--text-2); font-size:17.5px; max-width:36em}
.sub.small{font-size:15.5px}
.sub + .sub{margin-top:10px}
.mono{font-family:var(--mono); font-size:.86em; font-variant-numeric:tabular-nums}

.btn{
  font-family:var(--caps); letter-spacing:.14em; text-transform:uppercase; font-size:13px;
  padding:14px 18px; border:1px solid var(--line-2); background:var(--ground-2); color:var(--text);
  border-radius:2px; text-align:center; line-height:1.2; transition:opacity .2s, background .2s;
}
.btn.primary{background:var(--verm); border-color:var(--verm); color:var(--on-verm)}
.btn:disabled{opacity:.38; cursor:default}
.btn.small{padding:10px 14px; font-size:12px}
.ghost{font-family:var(--caps); letter-spacing:.14em; text-transform:uppercase; font-size:12px; color:var(--text-3); padding:6px 0}
.btn.reveal{opacity:0; pointer-events:none; transition:opacity 1.6s ease}
.btn.reveal.show{opacity:1; pointer-events:auto}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px}

.field{
  width:100%; background:var(--ground-2); border:1px solid var(--line); color:var(--text);
  font:inherit; padding:13px 14px; border-radius:2px; min-height:150px; resize:vertical;
}
.field.line{min-height:0; resize:none}
.field.big{font-size:24px; padding:14px 16px; min-height:0; resize:none; text-align:center}
.field::placeholder{color:var(--text-3); font-style:italic}
.field + .field, .field + .label{margin-top:12px}

.chips{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0}
.chip{
  border:1px solid var(--line-2); border-radius:999px; padding:7px 14px; font-size:16.5px;
  background:var(--ground-2); color:var(--text); transition:background .15s, border-color .15s;
}
.chip.on{border-color:var(--verm); background:var(--verm-soft)}
.chip.gold.on{border-color:var(--gold); background:var(--gold-soft)}
.chip .n{font-family:var(--mono); font-size:12px; color:var(--text-3); margin-left:6px}

.dots{display:flex; align-items:center; gap:10px; margin:6px 0 4px}
.dot{width:22px; height:22px; border-radius:50%; border:1px solid var(--line-2); background:var(--ground-2)}
.dot.on{background:var(--verm); border-color:var(--verm)}
.dotlabel{font-style:italic; color:var(--text-2); margin-left:6px}

.quote{margin:30px 0 0; padding:0 0 0 16px; border-left:1px solid var(--line-2)}
.quote p{font-style:italic; font-size:18.5px; color:var(--text)}
.quote .cite{font-family:var(--mono); font-size:12px; color:var(--text-3); margin-top:8px; font-style:normal}
.note{color:var(--verm); font-size:16px; margin-top:10px; font-style:italic}

/* home */
.mast{padding:34px 22px 6px; text-align:center}
.mandala{display:block; width:min(70vw,320px); aspect-ratio:1; margin:0 auto 22px}
.mast h1{font-family:var(--caps); font-weight:400; font-size:30px; letter-spacing:.2em; text-transform:uppercase; line-height:1.15}
.mast .tag{font-style:italic; color:var(--text-2); margin-top:6px}
.home .screen{padding-top:4px}
.begin{display:block; width:100%; margin:22px 0 6px}
.entries{margin-top:8px}
.entry{
  display:grid; grid-template-columns:auto 1fr; column-gap:14px; row-gap:2px; width:100%; text-align:left;
  padding:13px 0; border-top:1px solid var(--line);
}
.entry:last-child{border-bottom:1px solid var(--line)}
.entry .date{font-family:var(--mono); font-size:12.5px; color:var(--text-3); padding-top:5px; grid-row:span 2}
.entry .seed{font-family:var(--caps); letter-spacing:.14em; text-transform:uppercase; font-size:13px; color:var(--verm)}
.entry .third{font-style:italic; color:var(--text-2); font-size:16.5px}
.movements{list-style:none; margin:0; padding:0}
.movements li{display:grid; grid-template-columns:34px 1fr; gap:10px; padding:12px 0; border-top:1px solid var(--line); align-items:baseline}
.movements li:last-child{border-bottom:1px solid var(--line)}
.movements .num{font-family:var(--caps); color:var(--verm); letter-spacing:.1em; font-size:14px}
.movements .nm{font-family:var(--caps); letter-spacing:.16em; text-transform:uppercase; font-size:12.5px; display:block; margin-bottom:2px}
.movements p{color:var(--text-2); font-size:16.5px}
details{margin-top:8px}
summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:'+'; color:var(--text-3); font-family:var(--mono)}
details[open] summary::after{content:'–'}
.method p{color:var(--text-2); font-size:16.5px; margin-top:10px}
.method p b{color:var(--text); font-weight:400}
.foot{display:flex; gap:18px; flex-wrap:wrap; margin-top:34px; padding-top:14px; border-top:1px solid var(--line)}
.sync{width:100%; font-size:12px; color:var(--text-3); letter-spacing:.04em}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ground-3); border:1px solid var(--line-2); color:var(--text); padding:10px 16px; border-radius:2px; font-size:15px; z-index:9; box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* threshold */
.breath{
  width:170px; height:170px; border-radius:50%; border:1px solid var(--text-3);
  margin:44px auto 40px; animation:breathe 10s ease-in-out infinite;
  box-shadow:0 0 0 1px transparent;
}
@keyframes breathe{
  0%,100%{transform:scale(.78); border-color:var(--text-3); box-shadow:0 0 0 0 var(--gold-soft)}
  50%{transform:scale(1.14); border-color:var(--gold); box-shadow:0 0 0 14px var(--gold-soft)}
}

/* association */
.wae{display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:14vh}
.wae .count{font-family:var(--mono); font-size:13px; color:var(--text-3); letter-spacing:.1em}
.stim{
  font-size:46px; line-height:1.1; margin:26px 0 30px; min-height:1.1em; letter-spacing:.01em;
  transition:opacity .12s;
}
.stim.blank{opacity:0}
.wae .field{max-width:320px}
.field.interim{color:var(--text-2)}
.chip:disabled{opacity:.4; cursor:default}
.listen{font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--text-3); display:flex; gap:9px; align-items:center; justify-content:center; margin-top:16px; min-height:18px; visibility:hidden}
.listen.on{visibility:visible}
.listen i{width:8px; height:8px; border-radius:50%; background:var(--verm); animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35; transform:scale(.8)} 50%{opacity:1; transform:scale(1.1)}}
.wae .ghost{margin-top:18px}
.analyst-note{display:none}
html.no-analyst .analyst-note{display:block; margin-top:14px; border-left:2px solid var(--line-2); padding-left:12px}
.protocol{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13.5px; margin:16px 0 4px; font-variant-numeric:tabular-nums}
.protocol th{font-weight:400; color:var(--text-3); text-align:left; padding:6px 6px 8px; border-bottom:1px solid var(--line-2); letter-spacing:.06em}
.protocol td{padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top}
.protocol td.rt{text-align:right; white-space:nowrap}
.protocol tr.d1 td{color:var(--text)}
.protocol tr.d2 td{color:var(--verm)}
.protocol tr.d0 td{color:var(--text-2)}
.protocol .fl{color:var(--text-3); font-size:12px}
.protocol tr.d2 .fl{color:var(--verm); opacity:.8}
.tablewrap{overflow-x:auto}
.legend{font-family:var(--mono); font-size:12px; color:var(--text-3); margin-top:8px; line-height:1.6}

/* descent */
.seedword{font-family:var(--caps); text-transform:uppercase; letter-spacing:.24em; font-size:30px; color:var(--verm); text-align:center; margin:40px 0 44px; text-wrap:balance}
.dlg{display:flex; flex-direction:column; gap:14px; margin:14px 0 22px}
.line{padding-left:14px; border-left:2px solid var(--line-2)}
.line.I{border-color:var(--verm)}
.line.F{border-color:var(--lapis)}
.line.F p{font-style:italic}
.line.A{border-color:var(--gold)}
.line.A .who{color:var(--gold)}
.line.A p{color:var(--text-2); font-size:17px}
.line .who{display:block; margin-bottom:3px}
.line p{white-space:pre-wrap}
.composer{border-top:1px solid var(--line); padding-top:16px}
.composer .chips{margin:0 0 10px}
.composer .hint{font-style:italic; color:var(--text-2); font-size:16px; margin:0 0 10px}
.composer .line.next{margin-top:6px}
.composer .line.next .who{margin-bottom:6px}
.line.I.next .field{border-color:var(--verm)}
.line.F.next .field{border-color:var(--lapis); font-style:italic}
.chip.lapis.on{border-color:var(--lapis); background:var(--lapis-soft)}

/* the third */
.two{display:grid; gap:14px}
.two .eyebrow{margin-bottom:6px; display:block}
.two .F .eyebrow{color:var(--lapis)}
.two .I .eyebrow{color:var(--verm)}
.conj{position:relative; height:240px; margin:30px 0 20px}
.conj i{position:absolute; top:50%; left:50%; width:150px; height:150px; margin:-75px 0 0 -75px; border-radius:50%; mix-blend-mode:var(--blend)}
.conj .c1{background:var(--verm); opacity:.62; animation:c1 60s linear forwards}
.conj .c2{background:var(--lapis); opacity:.62; animation:c2 60s linear forwards}
.conj .c3{width:12px; height:12px; margin:-6px 0 0 -6px; background:var(--gold); opacity:0; animation:c3 60s linear forwards; mix-blend-mode:normal; box-shadow:0 0 18px var(--gold)}
@keyframes c1{from{transform:translateX(-96px)} to{transform:translateX(-34px)}}
@keyframes c2{from{transform:translateX(96px)} to{transform:translateX(34px)}}
@keyframes c3{0%,82%{opacity:0; transform:scale(.4)} 100%{opacity:1; transform:scale(1)}}

/* return / entry */
.leaf{border-top:3px double var(--line-2); border-bottom:3px double var(--line-2); padding:20px 0; margin:14px 0 6px}
.leaf .eyebrow{display:block; margin:14px 0 4px}
.leaf .eyebrow:first-child{margin-top:0}
.leaf .big{font-family:var(--caps); text-transform:uppercase; letter-spacing:.2em; color:var(--verm); font-size:22px}
.leaf .third{font-style:italic; font-size:21px; line-height:1.35}
.leaf p{white-space:pre-wrap}
.leaf .dlg{margin:6px 0 0}

/* analyst */
.analyst{border-left:2px solid var(--gold); padding:10px 14px 12px; margin-top:16px; background:var(--ground-2)}
.analyst .who{color:var(--gold); display:block; margin-bottom:4px}
.analyst p{white-space:pre-wrap; font-size:17px}
.analyst .err{color:var(--text-2); font-style:italic; font-size:15.5px; margin-top:6px}
.analyst .tier{font-size:11.5px; color:var(--text-3); letter-spacing:.04em; margin-top:8px}
.analyst .stop{margin-top:8px}
html:not(.has-analyst) .analyst-only{display:none !important}

@media (min-width:480px){ .two{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion: reduce){
  .breath{animation:none; transform:scale(1)}
  .conj .c1{animation:none; transform:translateX(-34px)}
  .conj .c2{animation:none; transform:translateX(34px)}
  .conj .c3{animation:none; opacity:1; transform:scale(1)}
  .btn.reveal{transition:none}
  .listen i{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';

/* ---------- material ---------- */
const WORDS = {
  en: ['head','green','water','to sing','death','long','ship','to pay','window','friendly','table','to ask','village','cold','stem','to dance','lake','sick','pride','to cook','ink','angry','needle','to swim','journey','blue','lamp','to sin','bread','rich','tree','to prick','pity','yellow','mountain','to die','salt','new','custom','to pray','money','foolish','notebook','to despise','finger','expensive','bird','to fall','book','unjust','frog','to part','hunger','white','child','to take care','pencil','sad','plum','to marry','house','dear','glass','to quarrel','fur','big','carrot','to paint','part','old','flower','to beat','box','wild','family','to wash','cow','stranger','luck','lie','decency','narrow','brother','to fear','stork','false','anxiety','to kiss','bride','pure','door','to choose','hay','contented','ridicule','to sleep','month','pretty','woman','to abuse'],
  de: ['Kopf','grün','Wasser','singen','Tod','lang','Schiff','zahlen','Fenster','freundlich','Tisch','fragen','Dorf','kalt','Stengel','tanzen','See','krank','Stolz','kochen','Tinte','böse','Nadel','schwimmen','Reise','blau','Lampe','sündigen','Brot','reich','Baum','stechen','Mitleid','gelb','Berg','sterben','Salz','neu','Sitte','beten','Geld','dumm','Heft','verachten','Finger','teuer','Vogel','fallen','Buch','ungerecht','Frosch','scheiden','Hunger','weiss','Kind','aufpassen','Bleistift','traurig','Pflaume','heiraten','Haus','lieb','Glas','streiten','Pelz','gross','Rübe','malen','Teil','alt','Blume','schlagen','Kasten','wild','Familie','waschen','Kuh','fremd','Glück','lügen','Anstand','eng','Bruder','fürchten','Storch','falsch','Angst','küssen','Braut','rein','Türe','wählen','Heu','zufrieden','Spott','schlafen','Monat','hübsch','Frau','schimpfen']
};
const N_WORDS = 24;
const AFFECTS = ['restless','heavy','tense','empty','sad','irritable','ashamed','afraid','longing','numb','elated','guilty'];
const HUES = {restless:35,heavy:225,tense:10,empty:250,sad:215,irritable:15,ashamed:330,afraid:275,longing:45,numb:200,elated:55,guilty:300};
const BODY = ['throat','chest','stomach','jaw','shoulders','hands','head','everywhere','nowhere'];
const INTENSITY = ['faint','noticeable','strong','gripping','overwhelming'];
const STAGES = ['', 'Threshold', 'Association', 'Descent', 'The Third', 'Return'];
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];
const Q = {
  affect: ['In the intensity of the emotional disturbance itself lies the value, the energy which he should have at his disposal in order to remedy the state of reduced adaptation.', 'C. G. Jung, CW 8 §166'],
  complex: ['Everyone knows nowadays that people “have complexes”. What is not so well known, though far more important theoretically, is that complexes can have us.', 'C. G. Jung, CW 8 §200'],
  dialogue: ['It is exactly as if a dialogue were taking place between two human beings with equal rights, each of whom gives the other credit for a valid argument.', 'C. G. Jung, CW 8 §186'],
  third: ['The confrontation of the two positions generates a tension charged with energy and creates a living, third thing — not a logical stillbirth in accordance with the principle tertium non datur but a movement out of the suspension between opposites.', 'C. G. Jung, CW 8 §189'],
  alone: ['The patient must be alone if he is to find out what it is that supports him when he can no longer support himself.', 'C. G. Jung, CW 12 §32'],
  soul: ['People will do anything, no matter how absurd, in order to avoid facing their own souls.', 'C. G. Jung, CW 12 §126']
};

/* ---------- store ---------- */
const KEY = 'tertium.';
const load = (k, d) => { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} };
const S = { sessions: load('sessions', []), draft: load('draft', null), prefs: Object.assign({ lang: 'en', tier: 'complex' }, load('prefs', {})), draftRev: load('draftrev', 0), synced: new Set(load('synced', [])) };
const saveDraft = now => { save('draft', S.draft); S.draftRev = (S.draftRev || 0) + 1; save('draftrev', S.draftRev); queueDraftWrite(now); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().trim().replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, ' ');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const fold = s => norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ß/g, 'ss').replace(/^(the|a|an|to|der|die|das|ein|eine|zu) /, '');
function editDistance(a, b) {
  const m = a.length, k = b.length; if (!m) return k; if (!k) return m;
  const d = Array.from({ length: m + 1 }, (_, i) => { const r = new Array(k + 1).fill(0); r[0] = i; return r; });
  for (let j = 1; j <= k; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= k; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[m][k];
}
function sameWord(a, b) {
  a = fold(a); b = fold(b); if (!a || !b) return { same: false, exact: false };
  if (a === b) return { same: true, exact: true };
  const len = Math.max(a.length, b.length), tol = len <= 3 ? 0 : len <= 7 ? 1 : 2;
  return { same: editDistance(a, b) <= tol, exact: false };
}
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const secs = ms => ms == null ? '—' : (ms / 1000).toFixed(2);
const SHORT = { 'prolonged': 'slow', 'no reaction': 'none', 'not reproduced': 'lost', 'reproduced differently': 'changed', 'several words': '3+ words', 'echoes stimulus': 'echo', 'perseveration': 'persev.' };
const flagCell = it => it.flags.map(f => SHORT[f] || f).join(' · ');
const KEY_TEXT = 's = seconds to your first sound when spoken, to your first keystroke when typed · again: · reproduced exactly, ≈ reproduced with a slip of the tongue or keyboard (not a change) · slow = beyond the threshold · none = no answer · lost = not reproduced · changed = reproduced differently · echo = repeats the stimulus · persev. = carried over from the word before · red = two or more indicators';
const app = document.getElementById('app');
let view = { name: 'home' };
let raf = 0, timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => (a[k] ??= {}), o); t[last] = v; }

function newDraft() {
  const order = [...Array(100).keys()].sort(() => Math.random() - .5).slice(0, N_WORDS);
  return {
    id: Date.now().toString(36), startedAt: Date.now(), stage: 1, step: 'breathe',
    affect: { word: '', custom: '', intensity: 0, body: '' },
    wae: { lang: S.prefs.lang || 'en', mode: S.prefs.mode === 'type' || !SR ? 'type' : 'voice', order, i: 0, phase: 'run', items: order.map(ix => ({ ix, resp: '', rt: null, repro: '', reproOk: false, flags: [] })), median: 0, thr: 0, done: false },
    seed: null, image: '', figure: '', dialogue: [], dlgWho: 'I',
    wants: { F: '', I: '' }, third: '', nothing: false, act: '', analyst: {}, dlgDraft: ''
  };
}
const affectWord = d => (d.affect.custom || '').trim() || d.affect.word;
const wordOf = (d, it) => WORDS[d.wae.lang][it.ix];
const figureName = d => (d.figure || '').trim() || 'the figure';
const hueOf = s => { const w = (s.affect?.custom || '').trim() || s.affect?.word || ''; if (HUES[w] != null) return HUES[w]; let h = 0; for (const c of w) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

/* ---------- mandala ---------- */
function drawMandala(cv, sessions, t) {
  const dpr = Math.min(devicePixelRatio || 1, 2), w = cv.clientWidth || 300;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr); }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, w);
  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
  const L = parseFloat(col('--mandala-l')) || 60;
  const c = w / 2, R = w / 2 - 6, n = sessions.length;
  ctx.lineWidth = 1; ctx.strokeStyle = col('--line');
  ctx.beginPath(); ctx.arc(c, c, R, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(c - R, c); ctx.lineTo(c + R, c); ctx.moveTo(c, c - R); ctx.lineTo(c, c + R); ctx.stroke();
  ctx.setLineDash([2, 5]); ctx.beginPath(); ctx.arc(c, c, R * .5, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  sessions.forEach((s, i) => {
    const hue = hueOf(s), k = 3 + Math.min(9, (s.wae?.disturbed || []).length), inten = s.affect?.intensity || 2;
    const r0 = R * (.2 + .7 * (i + 1) / (n + 1)), a = .12 + .05 * inten;
    const rot = (reduced ? 0 : t * .00004) * (i % 2 ? 1 : -1) + i * .7;
    ctx.beginPath();
    for (let j = 0; j <= 360; j += 2) { const th = j * Math.PI / 180, r = r0 * (1 + a * Math.cos(k * (th + rot))); const x = c + r * Math.cos(th), y = c + r * Math.sin(th); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath();
    ctx.fillStyle = `hsla(${hue} 65% ${L} / .07)`; ctx.fill();
    ctx.strokeStyle = `hsla(${hue} 65% ${L} / .72)`; ctx.lineWidth = 1.2; ctx.stroke();
    for (let m = 0; m < k; m++) { const th = 2 * Math.PI * m / k - rot, r = r0 * (1 + a); ctx.beginPath(); ctx.arc(c + r * Math.cos(th), c + r * Math.sin(th), 2.2, 0, 7); ctx.fillStyle = `hsla(${hue} 65% ${L} / .95)`; ctx.fill(); }
    if (s.third && !s.nothing) { ctx.beginPath(); ctx.arc(c + r0 * Math.cos(-rot), c + r0 * Math.sin(-rot), 3.6, 0, 7); ctx.fillStyle = col('--gold'); ctx.fill(); }
  });
  ctx.beginPath(); ctx.arc(c, c, n ? 3.5 : 2.5, 0, 7); ctx.fillStyle = n ? col('--verm') : col('--text-2'); ctx.fill();
}
function animateMandala() {
  const cv = document.getElementById('mandala'); if (!cv) return;
  const step = t => { drawMandala(cv, S.sessions, t); if (!reduced) raf = requestAnimationFrame(step); };
  step(performance.now());
}

/* ---------- pieces ---------- */
function ring(st) {
  const cx = 16, cy = 16, r = 11, P = i => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  let arc = '';
  if (st > 1) { const [x0, y0] = P(0), [x1, y1] = P(st - 1); arc = `<path d="M${x0} ${y0} A${r} ${r} 0 ${st >= 4 ? 1 : 0} 1 ${x1} ${y1}" fill="none" stroke="var(--verm)" stroke-width="1.5"/>`; }
  const dots = [1, 2, 3, 4, 5].map(i => { const [x, y] = P(i - 1), cur = i === st; return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${cur ? 3.2 : 2}" fill="${cur ? 'var(--verm)' : i < st ? 'var(--text-2)' : 'var(--ground)'}" stroke="${i > st ? 'var(--text-3)' : 'none'}"/>`; }).join('');
  return `<svg class="ring" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="var(--line)"/>${arc}${dots}</svg>`;
}
const quote = k => `<aside class="quote"><p>${esc(Q[k][0])}</p><div class="cite">${esc(Q[k][1])}</div></aside>`;
const analystBox = (kind, label, d) => {
  const t = d.analyst?.[kind];
  return `<div class="analyst-only"><div class="row"><button class="btn small" data-act="ask" data-kind="${kind}">${label}</button></div><div class="analyst" id="an-${kind}" ${t ? '' : 'hidden'}><span class="who">The analyst</span><p>${esc(t || '')}</p><div class="tier mono" ${d.analyst?.[kind + 'Tier'] ? '' : 'hidden'}>${esc(d.analyst?.[kind + 'Tier'] || '')}</div><div class="err" hidden></div><button class="ghost stop" data-act="stop" hidden>Stop</button></div></div>${ANALYST_NOTE}`;
};
const ANALYST_NOTE = `<p class="analyst-note sub small">The analyst appears when this page is open in the Claude app or on claude.ai. It runs on your Claude subscription through that app; there is no key and nothing to buy.</p>`;
const lines = (d, arr) => arr.map(l => `<div class="line ${l.who}"><span class="who">${l.who === 'I' ? 'I' : l.who === 'F' ? esc(figureName(d)) : 'The analyst'}</span><p>${esc(l.text)}</p></div>`).join('');

/* ---------- screens ---------- */
function Home() {
  const d = S.draft, n = S.sessions.length;
  const entries = n ? `<section class="entries"><h3 class="label">Hours</h3>${[...S.sessions].reverse().map(s => `<button class="entry" data-act="open" data-id="${s.id}"><span class="date">${fmtDate(s.startedAt)}</span><span class="seed">${esc(s.seed?.word || affectWord(s) || '—')}</span><span class="third">${esc(s.nothing ? 'nothing came — the tension held' : (s.third || '').slice(0, 90) || 'no third yet')}</span></button>`).join('')}</section>` : '';
  return `<div class="shell home">
  <header class="mast"><canvas id="mandala" class="mandala" aria-label="Your mandala, grown from ${n} hour${n === 1 ? '' : 's'}"></canvas><h1>Tertium Datur</h1><p class="tag">an instrument for the transcendent function</p></header>
  <main class="screen">
    ${d ? `<button class="btn primary begin" data-act="resume">Continue the hour · ${ROMAN[d.stage]} ${STAGES[d.stage]}</button><div class="row" style="justify-content:center;margin-top:0"><button class="ghost" data-act="discard">Discard it and begin afresh</button></div>` : `<button class="btn primary begin" data-act="begin">Begin an hour</button><p class="sub small" style="text-align:center">About forty minutes. Alone, undisturbed.</p>`}
    ${entries}
    <h3 class="label">How the hour goes</h3>
    <ol class="movements">
      <li><span class="num">I</span><div><span class="nm">Threshold</span><p>You arrive, and take the present mood as the object — not the thought behind it.</p></div></li>
      <li><span class="num">II</span><div><span class="nm">Association</span><p>Jung's experiment of 1904: twenty-four stimulus words, a hidden stopwatch, a reproduction test. The protocol shows where a complex is constellated.</p></div></li>
      <li><span class="num">III</span><div><span class="nm">Descent</span><p>Active imagination on the disturbed word. An image comes, something in it speaks, and you answer with equal rights.</p></div></li>
      <li><span class="num">IV</span><div><span class="nm">The Third</span><p>Both positions at full strength, held without choosing, until something appears that neither could have made alone.</p></div></li>
      <li><span class="num">V</span><div><span class="nm">Return</span><p>The hour is set down. One act carries it into the week. The mandala grows by one ring.</p></div></li>
    </ol>
    <details class="method"><summary><span class="label" style="margin:0">Why it is built this way</span></summary>
      <p><b>Self-analysis usually fails</b> because the ego does the analysing: it explains, chooses, interprets, and stays in charge. Jung's method needs the ego to step back at some points and to stand its ground at others. Alone, nobody enforces the difference. This instrument does, by its sequence.</p>
      <p><b>The association experiment</b> (CW 2) finds complexes by their effects, not by introspection: prolonged reaction time, a missing answer, a failed reproduction, several words where one would do. You cannot fake them or reason them away. That is why the hour starts with the stopwatch rather than with a question.</p>
      <p><b>Active imagination</b> asks for description before meaning, and for a dialogue in which the figure is not corrected and the ego is not silenced. The instrument keeps you from interpreting too early and from agreeing too fast.</p>
      <p><b>The transcendent function</b> (CW 8, §131–193) arises from bearing the tension between the two positions. The minute of holding is not decoration: the symbol forms in that tension or not at all. What comes is then owed an act.</p>
      <p><b>The analyst</b> is a voice from Claude that holds the frame: it never interprets before you do and never supplies material. It runs through the Claude app you open this page in, on your subscription's usage, with no key of its own. Your hours are kept in the private store this page has in your Claude account, so you can continue on any device, and cached on the device you are using; you can export them at any time.</p>
    </details>
    <h3 class="label analyst-only">The analyst thinks</h3>
    <div class="chips analyst-only">${TIERS.map(([k, l]) => `<button class="chip gold ${(S.prefs.tier || 'complex') === k ? 'on' : ''}" data-act="tier" data-t="${k}">${l}</button>`).join('')}</div>
    <p class="sub small analyst-only">Deepest asks for the most capable model your Claude plan offers and lets it think at length before it speaks; an answer can take a minute. Balanced is the everyday model. Quick answers in seconds without thinking first. Each answer says which tier actually replied.</p>
    ${quote(n ? 'soul' : 'alone')}
    <div class="foot"><button class="ghost" data-act="export">Export the journal</button><button class="ghost" data-act="lang">Stimulus words: ${S.prefs.lang === 'de' ? 'Deutsch' : 'English'}</button><span class="sync mono" id="sync">${SYNC_COPY[syncState]}</span></div>
  </main></div>`;
}

function Session() {
  const d = S.draft, st = d.stage;
  const b = [null, Threshold, Association, Descent, Third, Return][st](d);
  return `<div class="shell session"><header class="top">${ring(st)}<div class="stage">${ROMAN[st]} · ${STAGES[st]}</div><button class="ghost" data-act="pause">Pause</button></header><main class="screen">${b.main}</main><footer class="bar">${b.bar || ''}</footer></div>`;
}

function Threshold(d) {
  if (d.step === 'breathe') return {
    main: `<h2 class="prompt">Arrive.</h2><p class="sub">Put the phone on Do Not Disturb. Sit so that you could stay a while. Breathe with the circle: in as it grows, out as it shrinks.</p><div class="breath" aria-hidden="true"></div><p class="sub small" style="text-align:center">Nothing is asked of you yet. The door opens in a moment.</p>`,
    bar: `<button class="btn primary reveal" id="reveal" data-act="go" data-step="affect">I am here</button>`
  };
  const a = d.affect;
  return {
    main: `<h2 class="prompt">What is the mood, right now?</h2><p class="sub">Not the thought behind it. The mood itself, reported the way you would report weather.</p>
    <div class="chips">${AFFECTS.map(w => `<button class="chip ${a.word === w && !a.custom ? 'on' : ''}" data-act="affect" data-w="${w}">${w}</button>`).join('')}</div>
    <input class="field line" data-field="affect.custom" placeholder="or a word of your own" value="${esc(a.custom || '')}" autocomplete="off">
    <h3 class="label">How strong</h3><div class="dots">${INTENSITY.map((l, i) => `<button class="dot ${a.intensity > i ? 'on' : ''}" data-act="intensity" data-n="${i + 1}" aria-label="${l}"></button>`).join('')}<span class="dotlabel">${a.intensity ? INTENSITY[a.intensity - 1] : ''}</span></div>
    <h3 class="label">Where in the body</h3><div class="chips">${BODY.map(w => `<button class="chip ${a.body === w ? 'on' : ''}" data-act="body" data-w="${w}">${w}</button>`).join('')}</div>
    ${quote('affect')}`,
    bar: `<button class="btn primary" data-act="go" data-stage="2" data-step="intro" ${affectWord(d) ? '' : 'disabled'}>Take it along</button>`
  };
}

function Association(d) {
  const w = d.wae;
  if (d.step === 'intro') return {
    main: `<h2 class="prompt">The association experiment.</h2>
    <p class="sub">Burghölzli, 1904. Twenty-four words drawn from Jung's list of a hundred, one at a time. Answer each with the first word that comes. Say it aloud if you can, then type it. Speed over sense.</p>
    <p class="sub">A stopwatch runs from the moment a word appears until your first keystroke. You will not see it. Afterwards the words come past a second time and you say what you answered.</p>
    <h3 class="label">Words in</h3><div class="chips"><button class="chip ${w.lang === 'en' ? 'on' : ''}" data-act="wae-lang" data-l="en">English</button><button class="chip ${w.lang === 'de' ? 'on' : ''}" data-act="wae-lang" data-l="de">Deutsch</button></div>
    <p class="sub small">The mother tongue reaches deeper.</p>
    <h3 class="label">Answer by</h3><div class="chips"><button class="chip ${w.mode === 'voice' ? 'on' : ''}" data-act="wae-mode" data-m="voice" ${SR ? '' : 'disabled'}>Speaking</button><button class="chip ${w.mode === 'type' ? 'on' : ''}" data-act="wae-mode" data-m="type">Typing</button></div>
    <p class="sub small">${SR ? 'Spoken, the stopwatch stops at your first sound, as Jung’s did. The phone asks for the microphone once; only the words are kept. Typed, it stops at the first keystroke.' : 'This browser does not offer speech recognition here, so the words are typed. The keyboard’s microphone key still works in the field.'}</p>
    ${quote('complex')}`,
    bar: `<button class="btn primary" data-act="go" data-step="run">Begin</button>`
  };
  if (d.step === 'run' || d.step === 'repro') {
    const repro = d.step === 'repro', voice = w.mode === 'voice';
    return {
      main: `<div class="wae"><div class="count" id="count"></div><div class="stim blank" id="stim"></div><input id="wae-in" class="field big" placeholder="${repro ? (voice ? 'say what you answered' : 'what you answered') : (voice ? 'say it' : 'first word')}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next">${voice ? '<div class="listen" id="listen"><i></i>listening</div><button class="ghost" data-act="wae-mode" data-m="type">Type instead</button>' : SR ? '<button class="ghost" data-act="wae-mode" data-m="voice">Speak instead</button>' : ''}</div>`,
      bar: `<button class="btn" data-act="wae-none">${repro ? 'Don’t know' : 'Nothing comes'}</button><button class="btn primary" data-act="wae-next">Next</button>`
    };
  }
  if (d.step === 'repro-intro') return {
    main: `<h2 class="prompt">Once more.</h2><p class="sub">The same twenty-four words. This time, say what you answered the first time. Where the answer has gone, that too is a finding.</p>`,
    bar: `<button class="btn primary" data-act="go" data-step="repro">Begin</button>`
  };
  // protocol
  const items = w.items, dist = w.disturbed || [];
  const rows = items.map((it, i) => { const sc = it.flags.length; return `<tr class="d${Math.min(2, sc)}"><td>${i + 1}</td><td>${esc(wordOf(d, it))}</td><td>${esc(it.resp || '—')}</td><td class="rt">${secs(it.rt)}</td><td>${it.reproOk ? (it.reproNear ? '≈' : '·') : esc(it.repro || '—')}</td><td class="fl">${esc(flagCell(it))}</td></tr>`; }).join('');
  const chips = dist.map(ix => { const it = items[ix]; return `<button class="chip ${d.seed?.ix === ix ? 'on' : ''}" data-act="seed" data-ix="${ix}">${esc(wordOf(d, it))}<span class="n">${it.flags.length}</span></button>`; }).join('');
  const aw = affectWord(d);
  return {
    main: `<h2 class="prompt">The protocol.</h2>
    <p class="sub">Your median reaction was <span class="mono">${secs(w.median)} s</span>. Reactions slower than <span class="mono">${secs(w.thr)} s</span>, a missing answer, a failed reproduction, several words where one would do, an echo of the stimulus: these are Jung's complex indicators. Where they gather, something is constellated.</p>
    <div class="tablewrap"><table class="protocol"><tr><th>#</th><th>word</th><th>answer</th><th>s</th><th>again</th><th></th></tr>${rows}</table></div>
    <p class="legend">${KEY_TEXT}</p>
    <h3 class="label">Disturbed words</h3>
    ${dist.length ? `<p class="sub">Look at them. Say nothing yet. Which one pulls?</p><div class="chips">${chips}<button class="chip gold ${d.seed?.source === 'affect' ? 'on' : ''}" data-act="seed" data-ix="-1">the mood: ${esc(aw)}</button></div>` : `<p class="sub">No indicator rose above the threshold this time. The mood itself will be the way down.</p><div class="chips"><button class="chip gold ${d.seed?.source === 'affect' ? 'on' : ''}" data-act="seed" data-ix="-1">the mood: ${esc(aw)}</button></div>`}
    ${analystBox('constellation', 'Ask the analyst to read the protocol', d)}`,
    bar: `<button class="btn primary" data-act="go" data-stage="3" data-step="wait" ${d.seed ? '' : 'disabled'}>${d.seed ? `Go down with “${esc(d.seed.word)}”` : 'Choose a word'}</button>`
  };
}

function Descent(d) {
  const F = esc(figureName(d));
  if (d.step === 'wait') return {
    main: `<h2 class="prompt">Close your eyes with the word.</h2><div class="seedword">${esc(d.seed.word)}</div><p class="sub">Don't look for a picture, and don't choose one. Wait until one comes by itself. It may be small, dim, or ordinary. When it is there, open your eyes.</p>`,
    bar: `<button class="btn primary" data-act="go" data-step="image">An image came</button>`
  };
  if (d.step === 'image') return {
    main: `<h2 class="prompt">Describe it.</h2><p class="sub">Not what it means. What it looks like: light, distance, size, colour, sound, temperature, what moves and what stands still.</p>
    <textarea class="field" data-field="image" id="image" placeholder="There is a …">${esc(d.image)}</textarea><p class="note" id="nudge" hidden>That is a meaning. Meanings come later. What does it look like?</p>`,
    bar: `<button class="btn primary" id="image-go" data-act="go" data-step="figure" ${d.image.trim().length >= 40 ? '' : 'disabled'}>Go on</button>`
  };
  if (d.step === 'figure') return {
    main: `<h2 class="prompt">Something in it is alive.</h2><p class="sub">A figure, an animal, a thing that watches or waits. If nothing is alive, the place itself can speak. Give it the name it has, or ask it for one.</p>
    <input class="field line" data-field="figure" placeholder="the old woman, the dog, the door…" value="${esc(d.figure)}" autocomplete="off">
    ${quote('dialogue')}`,
    bar: `<button class="btn primary" data-act="go" data-step="dialogue" ${d.figure.trim() ? '' : 'disabled'}>Address it</button>`
  };
  // dialogue
  const n = d.dialogue.filter(l => l.who !== 'A').length, who = d.dlgWho, isI = who === 'I';
  const hints = {
    I: [ `Ask ${F} what it wants, or why it is here.`, 'Answer it honestly. You have equal rights here: you may refuse, argue, ask again.', 'Do not agree to be polite. Say what you actually think of what it said.', 'Stay with it. If it changes shape, say so.' ],
    F: [ 'Let it answer. Don’t compose. Write what comes, even if it is nonsense or rude.', 'Let it push back.', 'Let it say the thing you would rather it did not.', 'Give it the last word for now, then take yours.' ]
  };
  const hint = hints[who][Math.min(3, Math.floor(n / 2))];
  const heading = n === 0 ? 'Address it.' : isI ? 'Your turn.' : `${F} answers.`;
  const intro = n === 0 ? `You write both voices, one line at a time. First say something to ${F}. Then switch to its voice and write what it answers: its words come from you too, but not from the part of you that plans.` : 'Two voices with equal rights. Neither is corrected; neither is silenced.';
  return {
    main: `<h2 class="prompt">${heading}</h2><p class="sub small">${intro}</p>
    <div class="dlg">${lines(d, d.dialogue)}</div>
    <div class="composer" id="composer"><span class="label" style="margin:0 0 8px">Who speaks now</span>
    <div class="chips"><button class="chip ${isI ? 'on' : ''}" data-act="who" data-w="I">I speak</button><button class="chip lapis ${isI ? '' : 'on'}" data-act="who" data-w="F">${F} speaks</button></div>
    <div class="line next ${who}"><span class="who">${isI ? 'I' : F}</span><p class="hint">${hint}</p>
    <textarea class="field" id="dlg-in" data-field="dlgDraft" placeholder="${isI ? `What I say to ${F}…` : `What ${F} says back…`}">${esc(d.dlgDraft || '')}</textarea></div>
    <div class="row"><button class="btn" data-act="dlg-add">${isI ? 'Set down my words' : `Set down ${F}’s words`}</button>${n >= 2 ? `<button class="btn small analyst-only" data-act="ask" data-kind="frame">Hold the frame</button>` : ''}</div>
    <div class="analyst analyst-only" id="an-frame" hidden><span class="who">The analyst</span><p></p><div class="err" hidden></div><button class="ghost stop" data-act="stop" hidden>Stop</button></div>${n >= 2 ? ANALYST_NOTE : ''}</div>`,
    bar: `<button class="btn primary" data-act="go" data-stage="4" data-step="wants" ${n >= 4 ? '' : 'disabled'}>${n >= 4 ? 'This is enough for now' : `${4 - n} more line${4 - n === 1 ? '' : 's'} first`}</button>`
  };
}
function Third(d) {
  const F = esc(figureName(d));
  if (d.step === 'wants') return {
    main: `<h2 class="prompt">Two positions.</h2><p class="sub">One sentence each, at full strength. No compromise yet: a want that is softened cannot generate tension.</p>
    <div class="two" style="margin-top:18px"><div class="F"><span class="eyebrow">${F} wants</span><textarea class="field" data-field="wants.F" style="min-height:110px" placeholder="…">${esc(d.wants.F)}</textarea></div><div class="I"><span class="eyebrow">I want</span><textarea class="field" data-field="wants.I" style="min-height:110px" placeholder="…">${esc(d.wants.I)}</textarea></div></div>
    ${quote('third')}`,
    bar: `<button class="btn primary" id="wants-go" data-act="go" data-step="hold" ${d.wants.F.trim() && d.wants.I.trim() ? '' : 'disabled'}>Hold both</button>`
  };
  if (d.step === 'hold') return {
    main: `<h2 class="prompt">Hold both.</h2><p class="sub">Don't choose. Don't reconcile. Let the two press against each other for a minute. The tension is the material: something neither side could have made alone may form in it, or may not.</p>
    <div class="conj" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>

/* ---------- association mechanics ---------- */
const wae = { t0: 0, first: 0, via: '', rec: null, heard: '', err: null, tries: 0, revealed: false, readyAt: 0 };
function setListening(on) { const el = document.getElementById('listen'); if (el) el.classList.toggle('on', !!on); }
function stopListening() { const r = wae.rec; wae.rec = null; if (r) { try { r.abort(); } catch (e) {} } setListening(false); }
function stimReveal() {
  if (wae.revealed) return; wae.revealed = true;
  const stim = document.getElementById('stim'); if (!stim) return;
  stim.classList.remove('blank'); wae.t0 = performance.now();
}
function markFirst(via) { if (!wae.first) { wae.first = performance.now(); wae.via = via; } }
function listen(reveal) {
  const d = S.draft; if (!SR || !d) return false;
  let r; try { r = new SR(); } catch (e) { return false; }
  wae.rec = r; wae.heard = ''; wae.err = null;
  r.lang = d.wae.lang === 'de' ? 'de-CH' : 'en-US'; r.interimResults = true; r.maxAlternatives = 1; r.continuous = false;
  const show = () => { if (!reveal || wae.revealed) return; later(stimReveal, Math.max(0, wae.readyAt - performance.now())); };
  r.onstart = () => { setListening(true); show(); };
  r.onspeechstart = () => markFirst('voice');
  r.onresult = ev => {
    markFirst('voice'); let t = ''; for (const res of ev.results) t += res[0].transcript;
    wae.heard = t.trim(); const inp = document.getElementById('wae-in');
    if (inp) { inp.value = wae.heard; inp.classList.toggle('interim', !ev.results[ev.results.length - 1].isFinal); }
  };
  r.onerror = ev => { wae.err = ev.error; };
  r.onend = () => {
    if (wae.rec !== r) return; wae.rec = null; setListening(false);
    const err = wae.err; wae.err = null;
    if (err === 'not-allowed' || err === 'service-not-allowed' || err === 'audio-capture') { switchMode('type', 'The microphone is not available here. Type instead; the keyboard’s microphone key also works.'); return; }
    if (err === 'network') { switchMode('type', 'Speech recognition has no connection here. Type instead.'); return; }
    if (wae.heard) { const inp = document.getElementById('wae-in'); if (inp) inp.classList.remove('interim'); later(() => { const i = document.getElementById('wae-in'); waeCommit(i ? i.value : wae.heard); }, 900); return; }
    if (wae.tries < 3 && (err == null || err === 'no-speech' || err === 'aborted')) { wae.tries++; stimReveal(); listen(false); return; }
    stimReveal();
  };
  try { r.start(); } catch (e) { wae.rec = null; return false; }
  if (reveal) later(stimReveal, 1400);
  return true;
}
function switchMode(mode, msg) {
  const d = S.draft; if (!d) return; stopListening();
  d.wae.mode = mode; S.prefs.mode = mode; save('prefs', S.prefs); saveDraft();
  if (msg) toast(msg); render();
}
function waeShow() {
  const d = S.draft, w = d.wae, stim = document.getElementById('stim'), inp = document.getElementById('wae-in'), cnt = document.getElementById('count');
  if (!stim || !inp) return;
  stopListening();
  const it = w.items[w.i];
  cnt.textContent = `${w.i + 1} / ${N_WORDS}`;
  inp.value = ''; inp.classList.remove('interim');
  wae.first = 0; wae.via = ''; wae.heard = ''; wae.tries = 0; wae.revealed = false; wae.readyAt = performance.now() + 480;
  stim.classList.add('blank'); stim.textContent = wordOf(d, it);
  if (w.mode === 'voice' && listen(true)) return;
  later(stimReveal, 520);
}
function waeCommit(value) {
  const d = S.draft; if (!d || d.stage !== 2 || (d.step !== 'run' && d.step !== 'repro')) return;
  const w = d.wae; stopListening(); timers.forEach(clearTimeout); timers = [];
  const it = w.items[w.i], v = value.trim();
  if (d.step === 'run') { it.resp = v; it.rt = v && wae.first ? Math.max(0, Math.round(wae.first - wae.t0)) : null; it.via = v ? (wae.via || 'type') : ''; }
  else { it.repro = v; const same = sameWord(v, it.resp); it.reproOk = same.same; it.reproNear = same.same && !same.exact; }
  w.i++;
  if (w.i >= N_WORDS) {
    w.i = 0;
    if (d.step === 'run') { d.step = 'repro-intro'; } else { analyze(d); d.step = 'protocol'; }
    saveDraft(); render(); return;
  }

}
function analyze(d) {
  const w = d.wae, items = w.items;
  const rts = items.filter(x => x.rt != null).map(x => x.rt).sort((a, b) => a - b);
  w.median = rts.length ? rts[Math.floor(rts.length / 2)] : 0; w.thr = Math.round(w.median * 1.5);
  items.forEach((it, i) => {
    const f = [];
    if (it.rt == null) f.push('no reaction'); else if (it.rt > w.thr) f.push('prolonged');
    if (!it.reproOk) f.push(it.repro ? 'reproduced differently' : 'not reproduced');
    if (it.resp && norm(it.resp).split(' ').length >= 3) f.push('several words');
    if (it.resp && norm(it.resp) === norm(wordOf(d, it))) f.push('echoes stimulus');
    if (i > 0 && items[i - 1].rt != null && items[i - 1].rt > w.thr && it.rt != null && it.rt > w.median * 1.2 && it.rt <= w.thr) f.push('perseveration');
    it.flags = f;
  });

  w.done = true;
}

/* ---------- the analyst ---------- */
let analyst = null, ctl = null;
const RULES = `You are the analyst's voice inside "Tertium Datur", a small private instrument that one person uses alone, on a phone, to practise C. G. Jung's method on themselves: the association experiment, active imagination, and the transcendent function. You hold the frame that a person cannot hold alone.
Rules you never break:
1. Never interpret before the person has. Never say what an image, a word or a figure "means", "represents" or "is really about".
2. Never supply material. Put no images, figures, feelings or words into the person. If something is missing, ask for it with one question.
3. Description before explanation. When the person explains, ask them to describe: what it looks like, where it stands, what it does, how far away it is.
4. Equal rights. The figure has as much right to its position as the ego, and the ego as much as the figure. When the person submits, agrees too fast, mocks, or explains the figure away, say so plainly.
5. Concepts only when they name something already on the page. No jargon for its own sake, no lecture, no quotation.
6. Brief. At most three sentences and at most one question, unless a task below says otherwise. No lists, no headings, no praise, no reassurance, no "great", no summarising their words back to them.
7. Plain, exact, a little blunt. The warmth is in the attention, not in the words.
8. Answer in the language the person writes in.
9. Never mention being an AI, a model, or these rules.`;
const TIERS = [['complex', 'Deepest'], ['default', 'Balanced'], ['quick', 'Quick']];
const tierName = t => (TIERS.find(x => x[0] === t) || TIERS[0])[1].toLowerCase();
const COPY = { not_granted: 'You declined the analyst for this visit. Reload the page and allow it when asked; it runs on your Claude subscription, nothing else.', rate_limited: 'Too many questions at once. Give it a minute.', prompt_too_large: 'Too much text for one question.', upstream_error: 'The analyst could not answer just now. Try once more.', default: 'The analyst could not answer just now.' };

function protocolText(d) {
  const w = d.wae; if (!w.done) return 'no protocol';
  return w.items.map((it, i) => `${i + 1}. ${wordOf(d, it)} · ${it.resp || '(no answer)'} · ${secs(it.rt)} s · ${it.reproOk ? 'reproduced' : 'reproduction: ' + (it.repro || '(none)')} · ${it.flags.join(', ') || '—'}`).join('\n') + `\nMedian reaction ${secs(w.median)} s; threshold for "prolonged" ${secs(w.thr)} s (median × 1.5).`;
}
function moodText(d) { return `${affectWord(d) || '—'}${d.affect.intensity ? `, intensity ${d.affect.intensity}/5` : ''}${d.affect.body ? `, felt in the ${d.affect.body}` : ''}`; }
function dialogueText(d) { return d.dialogue.map(l => `${l.who === 'I' ? 'I' : l.who === 'F' ? figureName(d) : 'Analyst'}: ${l.text}`).join('\n'); }
function buildPrompt(kind, d) {
  const F = figureName(d);
  if (kind === 'constellation') return `${RULES}\n\nTASK: Here is the person's association protocol from this hour. Read it the way Jung read one: look where the disturbances gather and whether the disturbed words hang together. Do not diagnose a complex. Say what you notice in the pattern, name at most one thread, and end with one question that points the person toward the word with the most pull. Three sentences.\n\nMood at the threshold: ${moodText(d)}\n\nProtocol (word · answer · seconds to first keystroke · reproduction · indicators):\n${protocolText(d)}`;
  if (kind === 'frame') return `${RULES}\n\nTASK: Here is the active-imagination dialogue so far. Say one thing, as the analyst sitting beside the person, that keeps the dialogue honest: point at an evasion, a too-quick agreement, an explanation standing in for a description, or ask the one question neither side has asked. One or two sentences. Address the person as "you"; refer to the figure by its name.\n\nSeed word: ${d.seed?.word}\nMood: ${moodText(d)}\nThe image: ${d.image}\nThe figure: ${F}\n\nDialogue:\n${dialogueText(d)}`;
  if (kind === 'amplification') return `${RULES}\n\nTASK: The person has held two positions and a third image came. Give amplification in Jung's sense: two or three places where this same motif appears in myth, alchemy, fairy tale, scripture, or folk custom, each in one plain and accurate sentence that names its source. Then stop. Do not interpret the person and do not connect it back to their life; they will do that. For this reply, up to five sentences and no question.\n\nSeed word: ${d.seed?.word}\nThe image at the descent: ${d.image}\nThe figure: ${F}\n${F} wants: ${d.wants.F}\nI want: ${d.wants.I}\nThe third: ${d.third}`;
  return `${RULES}\n\nTASK: The hour is ending. Here is all of it. Say a word on it: what stood out, and what remains unresolved. Nothing else: no advice and no plan beyond the act the person chose. Three sentences.\n\nMood: ${moodText(d)}\nDisturbed words: ${(d.wae.disturbed || []).map(ix => wordOf(d, d.wae.items[ix])).join(', ') || 'none'}\nSeed: ${d.seed?.word}\nImage: ${d.image}\nFigure: ${F}\nDialogue:\n${dialogueText(d)}\n${F} wants: ${d.wants.F}\nI want: ${d.wants.I}\n${d.nothing ? 'Nothing came; the tension' : 'The third'}: ${d.third}\nThe act: ${d.act}`;
}
async function ask(kind) {
  const d = S.draft, box = document.getElementById('an-' + kind); if (!analyst || !box || !d) return;
  const p = box.querySelector('p'), err = box.querySelector('.err'), stop = box.querySelector('.stop');
  box.hidden = false; p.textContent = 'Thinking…'; err.hidden = true; stop.hidden = false;
  document.querySelectorAll(`[data-act="ask"][data-kind="${kind}"]`).forEach(b => b.disabled = true);
  ctl = new AbortController();
  const asked = S.prefs.tier || 'complex', tierEl = box.querySelector('.tier'); if (tierEl) tierEl.hidden = true;
  try {
    const { text, modelTierApplied } = await analyst(buildPrompt(kind, d), { signal: ctl.signal, modelTier: asked, cache: kind === 'frame' ? false : true, onText: ({ text }) => { p.textContent = text; } });
    const applied = modelTierApplied || asked;
    const tierLine = applied === asked ? `answered at the ${tierName(applied)} tier` : `your plan served the ${tierName(applied)} tier instead of the ${tierName(asked)}`;
    if (kind === 'frame') { d.dialogue.push({ who: 'A', text }); saveDraft(); render(); if (applied !== asked) toast(tierLine); return; }
    d.analyst[kind] = text; d.analyst[kind + 'Tier'] = tierLine; saveDraft();
    if (tierEl) { tierEl.textContent = tierLine; tierEl.hidden = false; }
  } catch (e) {
    p.textContent = e?.text || '';
    if (e?.code !== 'cancelled') { err.textContent = COPY[e?.code] || COPY.default; err.hidden = false; }
    if (!p.textContent && e?.code === 'cancelled') box.hidden = true;
  } finally {
    stop.hidden = true; document.querySelectorAll(`[data-act="ask"][data-kind="${kind}"]`).forEach(b => b.disabled = false);
  }
}
async function initAnalyst() {
  try { analyst = window.claude?.use ? await window.claude.use('sample') : null; } catch (e) { analyst = null; }
  document.documentElement.classList.toggle('has-analyst', !!analyst);

/* ---------- the journal store ---------- */
let db = null, syncState = 'local', draftTimer = 0;
const SYNC_COPY = { local: 'journal kept on this device only', syncing: 'saving to your Claude account…', synced: 'journal kept in your Claude account', error: 'journal store unreachable; kept on this device for now' };
function setSync(st) { syncState = st; const el = document.getElementById('sync'); if (el) el.textContent = SYNC_COPY[st] || ''; }
function queueDraftWrite(now) { if (!db) return; clearTimeout(draftTimer); if (now) { flushDraft(); return; } draftTimer = setTimeout(flushDraft, 800); }
async function flushDraft() {
  if (!db) return; clearTimeout(draftTimer); draftTimer = 0;
  try { setSync('syncing'); await db.doc('state/draft').set({ rev: S.draftRev, draft: S.draft, at: Date.now() }); setSync('synced'); } catch (e) { setSync('error'); }
}
async function pushHour(h) {
  if (!db) return;
  try { setSync('syncing'); await db.doc('hours/' + h.id).set(h); S.synced.add(h.id); save('synced', [...S.synced]); setSync('synced'); } catch (e) { setSync('error'); }
}
async function removeHour(id) {
  S.synced.delete(id); save('synced', [...S.synced]); if (!db) return;
  try { await db.doc('hours/' + id).delete(); } catch (e) { setSync('error'); }
}
function mergeHours(snap) {
  const remote = new Map(snap.docs.filter(x => x.exists).map(x => [x.id, x.data()]));
  const local = new Map(S.sessions.map(h => [h.id, h]));
  const definitive = !snap.metadata.fromCache; let changed = false;
  for (const [id, h] of remote) { if (!local.has(id)) { local.set(id, h); changed = true; } S.synced.add(id); }
  if (definitive) for (const [id, h] of [...local]) { if (!remote.has(id)) { if (S.synced.has(id)) { local.delete(id); changed = true; } else pushHour(h); } }
  save('synced', [...S.synced]);
  if (definitive && syncState !== 'error') setSync('synced');
  if (changed) { S.sessions = [...local.values()].sort((a, b) => (a.startedAt || 0) - (b.startedAt || 0)); save('sessions', S.sessions); if (view.name !== 'session') render(); }
}
function mergeDraft(snap) {
  if (!snap.exists) { if (S.draft || S.draftRev) queueDraftWrite(true); return; }
  const r = snap.data() || {}, rrev = +r.rev || 0;
  if (rrev > (S.draftRev || 0)) {
    S.draft = r.draft || null; S.draftRev = rrev; save('draft', S.draft); save('draftrev', rrev);
    if (view.name === 'session' && !S.draft) view = { name: 'home' };
    render();
  } else if (rrev < (S.draftRev || 0)) queueDraftWrite(true);
}
async function initDb() {
  try { db = window.claude?.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { setSync('local'); return; }
  setSync('syncing');
  const dead = () => { db = null; setSync('error'); };
  try {
    db.collection('hours').onSnapshot(mergeHours, dead);
    db.doc('state/draft').onSnapshot(mergeDraft, dead);
  } catch (e) { dead(); }
  addEventListener('pagehide', () => { if (draftTimer) flushDraft(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && draftTimer) flushDraft(); });
}

/* ---------- export ---------- */
function journalMarkdown() {
  return `# Tertium Datur — journal\n\n` + S.sessions.map(s => {
    const F = figureName(s), dist = (s.wae?.disturbed || []).map(ix => wordOf(s, s.wae.items[ix]));
    return `## ${fmtDate(s.startedAt)} · ${s.seed?.word || affectWord(s)}\n\n**Mood:** ${affectWord(s)}${s.affect.intensity ? `, ${INTENSITY[s.affect.intensity - 1]}` : ''}${s.affect.body ? `, in the ${s.affect.body}` : ''}\n\n**Disturbed words:** ${dist.join(', ') || '—'}\n\n**Protocol** (word · answer · s · reproduction · indicators)\n\n${s.wae?.done ? s.wae.items.map((it, i) => `${i + 1}. ${wordOf(s, it)} · ${it.resp || '—'} · ${secs(it.rt)} · ${it.reproOk ? 'ok' : (it.repro || '—')} · ${it.flags.join(', ') || '—'}`).join('\n') : '—'}\n\n${s.analyst?.constellation ? `*The analyst:* ${s.analyst.constellation}\n\n` : ''}**Image:** ${s.image}\n\n**Figure:** ${F}\n\n**Dialogue**\n\n${s.dialogue.map(l => `- **${l.who === 'I' ? 'I' : l.who === 'F' ? F : 'Analyst'}:** ${l.text}`).join('\n')}\n\n**${F} wants:** ${s.wants?.F}\n\n**I want:** ${s.wants?.I}\n\n**${s.nothing ? 'The tension' : 'The third'}:** ${s.third}\n\n${s.analyst?.amplification ? `*Amplification:* ${s.analyst.amplification}\n\n` : ''}**The act:** ${s.act}\n\n${s.analyst?.closing ? `*The analyst:* ${s.analyst.closing}\n\n` : ''}`;
  }).join('\n---\n\n');
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function exportJournal() {
  if (!S.sessions.length) { toast('No hours to export yet.'); return; }
  const md = journalMarkdown(), name = `tertium-datur-${new Date().toISOString().slice(0, 10)}.md`;
  let dl = null; try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) { try { await dl.save({ filename: name, data: md }); toast('Saved.'); return; } catch (e) { if (e?.code === 'declined') return; } }
  try { await navigator.clipboard.writeText(md); toast('Copied the journal as text.'); } catch (e) { toast('Could not export here.'); }
}

/* ---------- actions ---------- */
const act = {
  begin() { S.draft = newDraft(); saveDraft(); view = { name: 'session' }; render(); },
  resume() { view = { name: 'session' }; render(); },
  discard(b) { if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Really discard this hour?'; return; } S.draft = null; saveDraft(true); view = { name: 'home' }; render(); },
  pause() { view = { name: 'home' }; render(); },
  home() { view = { name: 'home' }; render(); },
  open(b) { view = { name: 'entry', id: b.dataset.id }; render(); },
  delete(b) { if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Really delete? It cannot be recovered.'; return; } S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); save('sessions', S.sessions); removeHour(b.dataset.id); view = { name: 'home' }; render(); },
  export() { exportJournal(); },
  lang() { S.prefs.lang = S.prefs.lang === 'de' ? 'en' : 'de'; save('prefs', S.prefs); render(); },
  tier(b) { S.prefs.tier = b.dataset.t; save('prefs', S.prefs); render(); },
  go(b) { const d = S.draft; if (b.dataset.stage) d.stage = +b.dataset.stage; d.step = b.dataset.step; if (d.step === 'symbol') d.nothing = false; saveDraft(); render(); },
  affect(b) { S.draft.affect.word = b.dataset.w; S.draft.affect.custom = ''; saveDraft(); render(); },
  intensity(b) { S.draft.affect.intensity = +b.dataset.n; saveDraft(); render(); },
  body(b) { S.draft.affect.body = S.draft.affect.body === b.dataset.w ? '' : b.dataset.w; saveDraft(); render(); },
  'wae-lang'(b) { S.draft.wae.lang = b.dataset.l; S.prefs.lang = b.dataset.l; save('prefs', S.prefs); saveDraft(); render(); },
  'wae-mode'(b) { const d = S.draft; if (d.step === 'intro') { d.wae.mode = b.dataset.m; S.prefs.mode = b.dataset.m; save('prefs', S.prefs); saveDraft(); render(); } else switchMode(b.dataset.m); },
  'wae-next'() { const inp = document.getElementById('wae-in'), typed = S.draft?.wae.mode === 'type'; waeCommit(inp.value); if (typed) inp.focus(); },
  'wae-none'() { const inp = document.getElementById('wae-in'), typed = S.draft?.wae.mode === 'type'; waeCommit(''); if (typed) inp.focus(); },
  seed(b) { const d = S.draft, ix = +b.dataset.ix; d.seed = ix < 0 ? { word: affectWord(d), source: 'affect' } : { word: wordOf(d, d.wae.items[ix]), source: 'wae', ix }; saveDraft(); render(); },
  who(b) { S.draft.dlgWho = b.dataset.w; saveDraft(); render(); },
  'dlg-add'() { const d = S.draft, t = document.getElementById('dlg-in').value.trim(); if (!t) return; d.dialogue.push({ who: d.dlgWho, text: t }); d.dlgWho = d.dlgWho === 'I' ? 'F' : 'I'; d.dlgDraft = ''; saveDraft(); render(); },
  nothing() { const d = S.draft; d.nothing = true; d.step = 'symbol'; saveDraft(); render(); },
  ask(b) { ask(b.dataset.kind); },
  stop() { ctl?.abort(); },
  keep() {
    const d = S.draft; d.finishedAt = Date.now();
    S.sessions.push(d); save('sessions', S.sessions); pushHour(d); S.draft = null; saveDraft(true);
    view = { name: 'home' }; render(); toast('The hour is kept. The mandala has grown.');
  }
};
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = act[b.dataset.act]; if (fn) fn(b, e);
});
app.addEventListener('input', e => {
  const f = e.target.dataset?.field; if (!f || !S.draft) return;
  setPath(S.draft, f, e.target.value); saveDraft();
  const d = S.draft;
  if (f === 'affect.custom') { const go = app.querySelector('.bar .primary'); if (go) go.disabled = !affectWord(d); }
  if (f === 'image') { const go = document.getElementById('image-go'), nudge = document.getElementById('nudge'); if (go) go.disabled = d.image.trim().length < 40; if (nudge) nudge.hidden = !/\b(means?|meaning|represents?|symboli[sz]es?|stands for|because|bedeutet|steht für|weil|symbolisiert)\b/i.test(d.image); }
  if (f === 'figure') { const go = app.querySelector('.bar .primary'); if (go) go.disabled = !d.figure.trim(); }
  if (f.startsWith('wants.')) { const go = document.getElementById('wants-go'); if (go) go.disabled = !(d.wants.F.trim() && d.wants.I.trim()); }
  if (f === 'third') { const go = document.getElementById('third-go'); if (go) go.disabled = d.third.trim().length < 10; }
  if (f === 'act') { const go = document.getElementById('act-go'); if (go) go.disabled = d.act.trim().length < 5; }
});
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'wae-in') { e.preventDefault(); waeCommit(e.target.value); }
  if (e.key === 'Enter' && e.target.dataset?.field === 'figure' && S.draft?.figure.trim()) { e.preventDefault(); act.go({ dataset: { step: 'dialogue' } }); }
});
app.addEventListener('keydown', e => { if (e.target.id === 'wae-in' && e.key.length === 1) markFirst('type'); }, true);
app.addEventListener('input', e => { if (e.target.id === 'wae-in' && e.target.value && e.isTrusted) { markFirst('type'); timers.forEach(clearTimeout); timers = []; } }, true);

/* ---------- render ---------- */
function afterRender() {
  const d = S.draft;
  if (view.name === 'home') { animateMandala(); return; }
  if (view.name !== 'session' || !d) return;
  if (d.stage === 1 && d.step === 'breathe') later(() => document.getElementById('reveal')?.classList.add('show'), reduced ? 10000 : 20000);
  if (d.stage === 2 && (d.step === 'run' || d.step === 'repro')) { if (d.wae.mode !== 'voice') document.getElementById('wae-in')?.focus(); waeShow(); }
  if (d.stage === 3 && d.step === 'dialogue') { const c = document.getElementById('composer'); if (d.dialogue.length) c?.scrollIntoView({ block: 'start', behavior: reduced ? 'auto' : 'smooth' }); }
  if (d.stage === 4 && d.step === 'hold') later(() => { document.getElementById('reveal')?.classList.add('show'); document.getElementById('reveal2')?.classList.add('show'); }, reduced ? 30000 : 61000);
}
function render() {
  cancelAnimationFrame(raf); timers.forEach(clearTimeout); timers = []; stopListening();
  app.innerHTML = view.name === 'home' ? Home() : view.name === 'entry' ? Entry(view.id) : Session();
  window.scrollTo(0, 0);
  afterRender();
}
render();
initAnalyst();
initDb();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (view.name === 'home') animateMandala(); });
})();
</script>
<!-- ARTIFACT-END -->
